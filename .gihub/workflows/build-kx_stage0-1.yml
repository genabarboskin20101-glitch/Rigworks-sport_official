                                  }
                              }
                              c.put("inst", cc.getMaxSupportedInstances());
                              if (avc && ci.isEncoder()) {
                                  boolean high = false;
                                  for (MediaCodecInfo.CodecProfileLevel pl : cc.profileLevels) {
