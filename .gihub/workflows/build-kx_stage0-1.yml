                              MediaCodecInfo.VideoCapabilities vc = cc.getVideoCapabilities();
                              if (vc != null) {
                                  c.put("maxW", vc.getSupportedWidths().getUpper().intValue());
                                  c.put("maxH", vc.getSupportedHeights().getUpper().intValue());
                                  c.put("bitrateMax", vc.getBitrateRange().getUpper().intValue());
                                  c.put("wAlign", vc.getWidthAlignment());
                                  c.put("hAlign", vc.getHeightAlignment());
                                  try {
