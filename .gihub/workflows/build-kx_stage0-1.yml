name: Build KX dex

# Собирает classes2.dex (нативный экспорт для Kadr), версия p0.9-ovl. Запускается сам при коммите этого файла
# и вручную: вкладка Actions → Build KX dex → Run workflow.
# Результат: Releases → kx-latest → classes2.dex (стабильная ссылка), а также артефакт kx-dex.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['.github/workflows/build-kx.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write sources
        shell: bash
        run: |
          mkdir -p src/kx/engine
          cat > src/kx/engine/KxFactory.java <<'KX_EOF'
          package kx.engine;

          import android.app.Activity;
          import android.app.AppComponentFactory;
          import android.app.Application;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.ContentProvider;
          import android.content.Intent;
          import android.util.Log;

          /**
           * Точка входа (хук H1): подменяет android:appComponentFactory шаблона.
           * В шаблоне у CoreComponentFactory методы instantiate* объявлены public final (проверено по
           * classes.dex), поэтому наследоваться от него нельзя. Создаём оригинал рефлексией и делегируем ему всё; после создания
           * Application ставим Boot (lifecycle-callbacks, которые подключают мост KExport к WebView).
           * Работает на API 28+; на 24-27 атрибут игнорируется системой, мост не появится.
           */
          public class KxFactory extends AppComponentFactory {
              private static final String TAG = "KX";
              private final AppComponentFactory core;

              public KxFactory() {
                  AppComponentFactory c = null;
                  try {
                      Class<?> k = Class.forName("androidx.core.app.CoreComponentFactory");
                      java.lang.reflect.Constructor<?> ctor = k.getDeclaredConstructor();
                      ctor.setAccessible(true);
                      c = (AppComponentFactory) ctor.newInstance();
                  } catch (Throwable t) {
                      Log.w(TAG, "CoreComponentFactory unavailable, using platform factory", t);
                  }
                  core = c;
              }

              @Override
              public Application instantiateApplication(ClassLoader cl, String name)
                      throws InstantiationException, IllegalAccessException, ClassNotFoundException {
                  Application app = core != null
                          ? core.instantiateApplication(cl, name)
                          : super.instantiateApplication(cl, name);
                  try {
                      Boot.install(app);
                  } catch (Throwable t) {
                      Log.w(TAG, "Boot.install failed", t);
                  }
                  return app;
              }

              @Override
              public Activity instantiateActivity(ClassLoader cl, String name, Intent intent)
                      throws InstantiationException, IllegalAccessException, ClassNotFoundException {
                  return core != null ? core.instantiateActivity(cl, name, intent)
                          : super.instantiateActivity(cl, name, intent);
              }

              @Override
              public BroadcastReceiver instantiateReceiver(ClassLoader cl, String name, Intent intent)
                      throws InstantiationException, IllegalAccessException, ClassNotFoundException {
                  return core != null ? core.instantiateReceiver(cl, name, intent)
                          : super.instantiateReceiver(cl, name, intent);
              }

              @Override
              public Service instantiateService(ClassLoader cl, String name, Intent intent)
                      throws InstantiationException, IllegalAccessException, ClassNotFoundException {
                  return core != null ? core.instantiateService(cl, name, intent)
                          : super.instantiateService(cl, name, intent);
              }

              @Override
              public ContentProvider instantiateProvider(ClassLoader cl, String name)
                      throws InstantiationException, IllegalAccessException, ClassNotFoundException {
                  return core != null ? core.instantiateProvider(cl, name)
                          : super.instantiateProvider(cl, name);
              }
          }
          KX_EOF
          cat > src/kx/engine/Boot.java <<'KX_EOF'
          package kx.engine;

          import android.app.Activity;
          import android.app.Application;
          import android.os.Bundle;
          import android.util.Log;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebView;

          import java.lang.reflect.Method;
          import java.util.WeakHashMap;

          /**
           * Находит WebView у WebViewActivity шаблона и регистрирует мост window.KExport.
           * onActivityPostCreated (API 29+) срабатывает сразу после onCreate, до коммита страницы;
           * onActivityStarted/Resumed - запасные точки (API 28 и случай поздней инициализации).
           */
          final class Boot implements Application.ActivityLifecycleCallbacks {
              private static final String TAG = "KX";
              private static boolean installed;
              private final WeakHashMap<Activity, KxBridge> bridges = new WeakHashMap<Activity, KxBridge>();

              static synchronized void install(Application app) {
                  if (installed) return;
                  installed = true;
                  app.registerActivityLifecycleCallbacks(new Boot());
              }

              private void attach(Activity a) {
                  try {
                      // только основная Activity оболочки (у AdMob и др. свои Activity со своими WebView)
                      if (!"WebViewActivity".equals(a.getClass().getSimpleName())) return;
                      KxBridge known = bridges.get(a);
                      if (known != null) {
                          known.ensureHook(); // оболочка могла заменить WebChromeClient
                          return;
                      }
                      WebView wv = findWebView(a);
                      if (wv == null) return;
                      KxBridge br = new KxBridge(a, wv);
                      wv.addJavascriptInterface(br, "KExport");
                      bridges.put(a, br);
                      br.ensureHook();
                      Log.i(TAG, "KExport attached to " + a.getClass().getName());
                      // объект виден только документам, загруженным ПОСЛЕ регистрации: если страница уже загружена
                      // (WebView создан лениво, регистрация поздняя) - перезагружаем её один раз
                      if (wv.getUrl() != null && wv.getProgress() >= 100) {
                          Log.i(TAG, "page already loaded, reloading once");
                          wv.reload();
                      }
                  } catch (Throwable t) {
                      Log.w(TAG, "attach failed", t);
                  }
              }

              private static WebView findWebView(Activity a) {
                  try {
                      Method m = a.getClass().getMethod("getWebView");
                      Object o = m.invoke(a);
                      if (o instanceof WebView) return (WebView) o;
                  } catch (Throwable ignored) {
                      // lateinit ещё не готов или метод переименован - идём обходом View
                  }
                  View root = a.getWindow() != null ? a.getWindow().peekDecorView() : null;
                  return root == null ? null : walk(root);
              }

              private static WebView walk(View v) {
                  if (v instanceof WebView) return (WebView) v;
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) {
                          WebView w = walk(g.getChildAt(i));
                          if (w != null) return w;
                      }
                  }
                  return null;
              }

              public void onActivityCreated(Activity a, Bundle b) { }

              public void onActivityPostCreated(Activity a, Bundle b) { attach(a); }

              public void onActivityStarted(Activity a) { attach(a); }

              public void onActivityResumed(Activity a) { attach(a); }

              public void onActivityPaused(Activity a) { }

              public void onActivityStopped(Activity a) { }

              public void onActivitySaveInstanceState(Activity a, Bundle b) { }

              public void onActivityDestroyed(Activity a) {
                  KxBridge br = bridges.remove(a);
                  if (br != null) br.shutdown();
              }
          }
          KX_EOF
          cat > src/kx/engine/KxBridge.java <<'KX_EOF'
          package kx.engine;

          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.Intent;
          import android.content.res.AssetFileDescriptor;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.StatFs;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import android.util.Log;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.RandomAccessFile;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Set;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.atomic.AtomicInteger;

          /** JS-интерфейс window.KExport. Все методы возвращают строку (JSON). */
          public final class KxBridge {
              private static final String TAG = "KX";
              private static final String OK = "{\"ok\":true}";
              private static final long CACHE_LIMIT = 3L << 30;

              final Activity act;
              private final WebView web;
              private final File dir;
              private final HashMap<String, RandomAccessFile> open = new HashMap<String, RandomAccessFile>();
              private final HashMap<String, Long> sizes = new HashMap<String, Long>();
              private final ConcurrentHashMap<String, Exporter> jobs = new ConcurrentHashMap<String, Exporter>();
              private final Set<String> uris = Collections.synchronizedSet(new HashSet<String>());
              private final AtomicInteger seq = new AtomicInteger();
              private final ConcurrentHashMap<String, Uri> uriSrc = new ConcurrentHashMap<String, Uri>();
              private final ArrayList<Picked> picked = new ArrayList<Picked>();
              volatile boolean hooked;

              private static final class Picked {
                  Uri uri;
                  String name = "";
                  long size = -1;
              }

              KxBridge(Activity a, WebView w) {
                  act = a;
                  web = w;
                  dir = new File(a.getCacheDir(), "kx");
                  dir.mkdirs();
              }

              // ---------- вспомогательное ----------

              static JSONObject o(Object... kv) {
                  JSONObject j = new JSONObject();
                  try {
                      for (int i = 0; i + 1 < kv.length; i += 2) j.put((String) kv[i], kv[i + 1]);
                  } catch (Exception ignored) {
                      // значения собираются из своих же типов
                  }
                  return j;
              }

              static String err(String msg) {
                  return o("ok", false, "error", msg).toString();
              }

              static String err(Throwable t) {
                  Log.w(TAG, "bridge error", t);
                  return err(t.getClass().getSimpleName() + ": " + t.getMessage());
              }

              private static boolean validId(String id) {
                  return id != null && id.matches("[A-Za-z0-9_\\-]{1,64}");
              }

              File fileFor(String id) {
                  if (!validId(id)) return null;
                  File f = new File(dir, id + ".bin");
                  return (f.exists() && new File(dir, id + ".ok").exists()) ? f : null;
              }

              Src srcFor(String id) {
                  if (!validId(id)) return null;
                  Uri u = uriSrc.get(id);
                  if (u != null) return new Src(u);
                  File f = fileFor(id);
                  return f == null ? null : new Src(f);
              }

              /** Подменяет WebChromeClient оболочки обёрткой FileHook (API 26+); вызывается из потока UI. */
              void ensureHook() {
                  try {
                      if (Build.VERSION.SDK_INT < 26) return;
                      WebChromeClient cur = web.getWebChromeClient();
                      if (cur == null) return;
                      if (!(cur instanceof FileHook)) web.setWebChromeClient(new FileHook(cur, this));
                      hooked = true;
                  } catch (Throwable t) {
                      Log.w(TAG, "ensureHook failed", t);
                  }
              }

              /** Запоминает URI, которые пользователь выбрал в системном диалоге (вызывается из FileHook). */
              void recordPicked(Uri[] uris) {
                  if (uris == null) return;
                  ContentResolver cr = act.getContentResolver();
                  for (Uri u : uris) {
                      if (u == null) continue;
                      Picked p = new Picked();
                      p.uri = u;
                      Cursor c = null;
                      try {
                          c = cr.query(u, new String[] {OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE}, null, null, null);
                          if (c != null && c.moveToFirst()) {
                              int ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                              int si = c.getColumnIndex(OpenableColumns.SIZE);
                              if (ni >= 0 && !c.isNull(ni)) p.name = c.getString(ni);
                              if (si >= 0 && !c.isNull(si)) p.size = c.getLong(si);
                          }
                      } catch (Throwable t) {
                          Log.w(TAG, "query picked failed", t);
                      } finally {
                          if (c != null) c.close();
                      }
                      if (p.size < 0) {
                          try {
                              AssetFileDescriptor f = cr.openAssetFileDescriptor(u, "r");
                              if (f != null) {
                                  p.size = f.getLength();
                                  f.close();
                              }
                          } catch (Throwable ignored) {
                              // размер определится позже или совпадение не найдётся
                          }
                      }
                      synchronized (this) {
                          picked.add(p);
                          while (picked.size() > 300) picked.remove(0);
                      }
                  }
              }

              private static String sha1(String s) throws Exception {
                  byte[] d = MessageDigest.getInstance("SHA-1").digest(s.getBytes("UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  for (byte b : d) sb.append(String.format("%02x", b & 0xff));
                  return sb.toString();
              }

              private long free() {
                  return new StatFs(dir.getPath()).getAvailableBytes();
              }

              private void trimCache(long need) {
                  File[] fs = dir.listFiles();
                  if (fs == null) return;
                  ArrayList<File> bins = new ArrayList<File>();
                  long total = 0;
                  for (File f : fs) {
                      if (f.getName().endsWith(".bin")) {
                          bins.add(f);
                          total += f.length();
                      }
                  }
                  Collections.sort(bins, new java.util.Comparator<File>() {
                      public int compare(File a, File b) {
                          return Long.compare(a.lastModified(), b.lastModified());
                      }
                  });
                  for (File f : bins) {
                      if (total <= CACHE_LIMIT && free() >= need) break;
                      total -= f.length();
                      String base = f.getName().substring(0, f.getName().length() - 4);
                      f.delete();
                      new File(dir, base + ".ok").delete();
                  }
              }

              void emit(JSONObject ev) {
                  String s = ev.toString()
                          .replace(String.valueOf((char) 0x2028), "\\u2028")
                          .replace(String.valueOf((char) 0x2029), "\\u2029");
                  final String js = "window.__kx&&window.__kx.onEvent&&window.__kx.onEvent(" + s + ")";
                  act.runOnUiThread(new Runnable() {
                      public void run() {
                          try {
                              web.evaluateJavascript(js, null);
                          } catch (Throwable t) {
                              Log.w(TAG, "emit failed", t);
                          }
                      }
                  });
              }

              void keepScreenOn(final boolean on) {
                  act.runOnUiThread(new Runnable() {
                      public void run() {
                          try {
                              if (on) act.getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              else act.getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          } catch (Throwable ignored) {
                              // окно уже закрыто
                          }
                      }
                  });
              }

              void jobDone(String id) {
                  jobs.remove(id);
              }

              void registerUri(String u) {
                  uris.add(u);
              }

              void shutdown() {
                  for (Exporter e : jobs.values()) e.cancel();
                  synchronized (this) {
                      for (RandomAccessFile r : open.values()) {
                          try {
                              r.close();
                          } catch (Throwable ignored) {
                              // уже закрыт
                          }
                      }
                      open.clear();
                  }
              }

              // ---------- методы для JS ----------

              @JavascriptInterface
              public String ping() {
                  return "pong";
              }

              @JavascriptInterface
              public String caps() {
                  try {
                      JSONObject o = Probe.caps();
                      o.put("zeroCopy", hooked);
                      return o.toString();
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              @JavascriptInterface
              public synchronized String ingestBegin(String id, String name, long size, long lastModified, String mime) {
                  try {
                      if (!validId(id) || size <= 0) return err("bad_args");
                      File bin = new File(dir, id + ".bin");
                      File ok = new File(dir, id + ".ok");
                      RandomAccessFile prev = open.remove(id);
                      if (prev != null) prev.close();
                      if (ok.exists() && bin.length() == size) {
                          bin.setLastModified(System.currentTimeMillis());
                          return "{\"ok\":true,\"cached\":true}";
                      }
                      ok.delete();
                      bin.delete();
                      long need = size + (64L << 20);
                      if (free() < need) trimCache(need);
                      if (free() < need) return err("no_space");
                      open.put(id, new RandomAccessFile(bin, "rw"));
                      sizes.put(id, size);
                      return "{\"ok\":true,\"cached\":false}";
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              @JavascriptInterface
              public synchronized String ingestChunk(String id, long offset, String b64) {
                  try {
                      RandomAccessFile raf = open.get(id);
                      if (raf == null) return err("not_open");
                      byte[] b = Base64.decode(b64, Base64.DEFAULT);
                      raf.seek(offset);
                      raf.write(b);
                      return OK;
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              @JavascriptInterface
              public synchronized String ingestEnd(String id) {
                  try {
                      RandomAccessFile raf = open.remove(id);
                      if (raf == null) return err("not_open");
                      raf.close();
                      File bin = new File(dir, id + ".bin");
                      Long want = sizes.remove(id);
                      if (want == null || bin.length() != want.longValue()) {
                          bin.delete();
                          return err("size_mismatch");
                      }
                      new File(dir, id + ".ok").createNewFile();
                      // info не считаем: фоновая передача не должна в конце замораживать страницу разбором файла;
                      // экспорт при необходимости вызовет probe(id)
                      return OK;
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              @JavascriptInterface
              public String probe(String id) {
                  try {
                      Src s = srcFor(id);
                      if (s == null) return err("unknown_id");
                      return infoJson(s);
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              private String infoJson(Src s) throws Exception {
                  JSONObject r = o("ok", true);
                  try {
                      r.put("info", Probe.info(act, s));
                  } catch (Throwable t) {
                      // не медиафайл (например, картинка) - это не ошибка передачи
                      r.put("info", JSONObject.NULL);
                      r.put("probeError", String.valueOf(t));
                  }
                  return r.toString();
              }

              /** Находит среди выбранных пользователем файлов тот, что соответствует File из страницы (по имени и размеру). */
              @JavascriptInterface
              public synchronized String resolve(String name, long size, long lastModified) {
                  try {
                      Picked hit = null;
                      for (int i = picked.size() - 1; i >= 0; i--) {
                          Picked p = picked.get(i);
                          if (p.size == size && name != null && name.equals(p.name)) {
                              hit = p;
                              break;
                          }
                      }
                      if (hit == null) return o("ok", false, "error", "not_picked", "picked", picked.size(), "hook", hooked).toString();
                      try {
                          AssetFileDescriptor afd = act.getContentResolver().openAssetFileDescriptor(hit.uri, "r");
                          if (afd == null) return err("unreadable");
                          afd.close();
                      } catch (Throwable t) {
                          return o("ok", false, "error", "unreadable", "detail", String.valueOf(t)).toString();
                      }
                      String id = "u" + sha1(hit.uri.toString());
                      uriSrc.put(id, hit.uri);
                      // Разбор контейнера здесь не нужен: редактор info не использует, а вызов синхронный (JS-поток
                      // стоит, пока идёт демукс) — страница замирала на сотни мс при каждом импорте. Экспорт сам
                      // спросит probe(id), если info пустой.
                      JSONObject r = o("ok", true, "id", id, "zeroCopy", true);
                      r.put("info", JSONObject.NULL);
                      return r.toString();
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              @JavascriptInterface
              public synchronized String clearCache() {
                  File[] fs = dir.listFiles();
                  int n = 0;
                  if (fs != null) {
                      for (File f : fs) {
                          if (f.delete()) n++;
                      }
                  }
                  return o("ok", true, "deleted", n).toString();
              }

              @JavascriptInterface
              public String exportStart(String jobJson) {
                  try {
                      if (Build.VERSION.SDK_INT < 29) return unsupported("api<29");
                      if (!jobs.isEmpty()) return err("busy");
                      Exporter e = Exporter.parse(this, "j" + seq.incrementAndGet(), new JSONObject(jobJson));
                      if (!e.unsupported.isEmpty()) return unsupported(e.unsupported.toArray(new String[0]));
                      jobs.put(e.jobId, e);
                      e.start();
                      return o("ok", true, "jobId", e.jobId).toString();
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              private static String unsupported(String... items) {
                  return o("ok", false, "unsupported", new JSONArray(Arrays.asList(items))).toString();
              }

              @JavascriptInterface
              public String exportCancel(String jobId) {
                  Exporter e = jobs.get(jobId);
                  if (e != null) e.cancel();
                  return OK;
              }

              @JavascriptInterface
              public String openUri(String uri) {
                  return launch(uri, false);
              }

              @JavascriptInterface
              public String shareUri(String uri) {
                  return launch(uri, true);
              }

              private String launch(String s, final boolean share) {
                  if (s == null || !uris.contains(s)) return err("unknown_uri");
                  final Uri u = Uri.parse(s);
                  act.runOnUiThread(new Runnable() {
                      public void run() {
                          try {
                              Intent i;
                              if (share) {
                                  i = new Intent(Intent.ACTION_SEND);
                                  i.setType("video/mp4");
                                  i.putExtra(Intent.EXTRA_STREAM, u);
                                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  act.startActivity(Intent.createChooser(i, null));
                              } else {
                                  i = new Intent(Intent.ACTION_VIEW);
                                  i.setDataAndType(u, "video/mp4");
                                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  act.startActivity(i);
                              }
                          } catch (Throwable t) {
                              Log.w(TAG, "launch failed", t);
                          }
                      }
                  });
                  return OK;
              }
          }
          KX_EOF
          cat > src/kx/engine/Probe.java <<'KX_EOF'
          package kx.engine;

          import android.content.Context;
          import android.media.MediaCodecInfo;
          import android.media.MediaCodecList;
          import android.media.MediaExtractor;
          import android.media.MediaFormat;
          import android.os.Build;
          import android.util.Range;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.Collections;

          /** caps() и probe(): возможности кодеков устройства и сведения об исходном файле. */
          final class Probe {
              private Probe() { }

              static boolean isHw(MediaCodecInfo ci) {
                  if (Build.VERSION.SDK_INT >= 29) return ci.isHardwareAccelerated();
                  String n = ci.getName();
                  return !(n.startsWith("OMX.google.") || n.startsWith("c2.android.") || n.startsWith("c2.google."));
              }

              static JSONObject caps() throws Exception {
                  JSONObject o = new JSONObject();
                  o.put("v", 1);
                  o.put("build", "p0.9-ovl");
                  o.put("api", Build.VERSION.SDK_INT);
                  o.put("model", Build.MANUFACTURER + " " + Build.MODEL);
                  o.put("hardware", Build.HARDWARE);
                  JSONArray feats = new JSONArray();
                  feats.put("gl");
                  feats.put("probe");
                  feats.put("ingest-chunk");
                  feats.put("audio-copy");
                  feats.put("overlay-image");
                  feats.put("overlay-fade");
                  feats.put("overlay-tail");
                  feats.put("transition-dip");
                  if (Build.VERSION.SDK_INT >= 29) {
                      feats.put("export");
