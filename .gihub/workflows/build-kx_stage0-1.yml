                          MediaFormat f = ex.getTrackFormat(c.vtrack);
                          long dur = f.containsKey(MediaFormat.KEY_DURATION) ? f.getLong(MediaFormat.KEY_DURATION) : 0;
                          c.inUs = (long) (c.in * 1e6);
                          c.outUs = c.out > 0 ? (long) (c.out * 1e6) : dur;
                          if (dur > 0 && c.outUs > dur) c.outUs = dur;
                          if (c.outUs <= c.inUs) throw new Fail("bad_range", "empty time range", true);
                          c.startUs = acc * 1e6;
                          c.kStart = Math.round(acc * fps);
                          acc += (c.outUs - c.inUs) / 1e6;
                          c.kEnd = Math.round(acc * fps);
                          if (audioCopy && !decodeOnly && !noEnc) collectAudio(c, ex);
                      } finally {
                          ex.release();
                      }
                  }
                  totalSec = acc + (decodeOnly ? 0 : tailSec);
                  totalTicks = clips.get(clips.size() - 1).kEnd;
                  tailEndTick = totalTicks;
                  if (tailSec > 0 && !decodeOnly) {
                      tailEndTick = Math.max(totalTicks, Math.round((acc + tailSec) * fps));
                      totalTicks = tailEndTick;
                  }
                  for (int i = 0; i < clips.size(); i++) {
                      if (i > 0) {
                          clips.get(i).trIn = clips.get(i - 1).trOut;
                          clips.get(i).trInDur = clips.get(i - 1).trOutDur;
                      }
                  }
                  clips.get(clips.size() - 1).trOut = null;
              }

              private static MediaCodecInfo findEncoder(String mime) {
                  MediaCodecInfo best = null;
                  for (MediaCodecInfo ci : new MediaCodecList(MediaCodecList.REGULAR_CODECS).getCodecInfos()) {
                      if (!ci.isEncoder()) continue;
                      boolean has = false;
                      for (String t : ci.getSupportedTypes()) {
                          if (t.equalsIgnoreCase(mime)) has = true;
                      }
                      if (!has) continue;
                      if (Probe.isHw(ci)) return ci;
                      if (best == null) best = ci;
                  }
                  return best;
              }

              private int autoBitrate() {
                  double effFps = fps <= 30 ? fps : 30 + (fps - 30) * 0.6;
                  double b = outW * (double) outH * effFps * 0.2;
                  return (int) Math.max(2000000, Math.min(45000000, b));
              }

              private MediaCodec configureEncoder(MediaCodecInfo ci, String mime) throws Fail {
                  MediaCodecInfo.CodecCapabilities cc = ci.getCapabilitiesForType(mime);
                  boolean high = false;
                  for (MediaCodecInfo.CodecProfileLevel pl : cc.profileLevels) {
                      if (pl.profile == MediaCodecInfo.CodecProfileLevel.AVCProfileHigh) high = true;
                  }
                  boolean vbr = cc.getEncoderCapabilities()
                          .isBitrateModeSupported(MediaCodecInfo.EncoderCapabilities.BITRATE_MODE_VBR);
                  Exception last = null;
                  for (int attempt = 0; attempt < 3; attempt++) {
                      MediaCodec c = null;
                      try {
                          c = MediaCodec.createByCodecName(ci.getName());
                          MediaFormat f = MediaFormat.createVideoFormat(mime, outW, outH);
                          f.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface);
                          f.setInteger(MediaFormat.KEY_BIT_RATE, bitrate);
                          f.setInteger(MediaFormat.KEY_FRAME_RATE, (int) Math.round(fps));
                          f.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 2);
                          if (attempt < 2) {
                              if (vbr) f.setInteger(MediaFormat.KEY_BITRATE_MODE, MediaCodecInfo.EncoderCapabilities.BITRATE_MODE_VBR);
                              f.setInteger(MediaFormat.KEY_PRIORITY, 1);
                              f.setInteger(MediaFormat.KEY_OPERATING_RATE, Short.MAX_VALUE);
                          }
                          if (attempt == 0 && high) {
                              f.setInteger(MediaFormat.KEY_PROFILE, MediaCodecInfo.CodecProfileLevel.AVCProfileHigh);
                          }
                          c.configure(f, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                          Log.i(TAG, "encoder " + ci.getName() + " configured, attempt " + attempt);
                          encAttempt = attempt;
                          return c;
                      } catch (Exception ex) {
                          last = ex;
                          Log.w(TAG, "encoder configure attempt " + attempt + " failed", ex);
                          if (c != null) {
                              try {
                                  c.release();
                              } catch (Throwable ignored) {
                                  // не создан до конца
                              }
                          }
                      }
                  }
                  throw new Fail("encoder_configure", String.valueOf(last), true);
              }

              private MediaCodec createDec(String mime) throws Exception {
                  String want = decPref;
                  String pick = null;
                  StringBuilder cands = new StringBuilder();
                  for (MediaCodecInfo ci : new MediaCodecList(MediaCodecList.REGULAR_CODECS).getCodecInfos()) {
                      if (ci.isEncoder() || ci.getName().endsWith(".secure")) continue;
                      boolean has = false;
                      for (String t : ci.getSupportedTypes()) {
                          if (t.equalsIgnoreCase(mime)) has = true;
                      }
                      if (!has) continue;
                      boolean hw = Probe.isHw(ci);
                      if (cands.length() > 0) cands.append(",");
                      cands.append(ci.getName()).append(hw ? "[hw]" : "[sw]");
                      if (pick == null && want.length() > 0) {
                          if ("hw".equals(want) && hw) pick = ci.getName();
                          else if ("sw".equals(want) && !hw) pick = ci.getName();
                          else if (want.equals(ci.getName())) pick = ci.getName();
                      }
                  }
                  decCands = cands.toString();
                  if (pick != null) return MediaCodec.createByCodecName(pick);
                  return MediaCodec.createDecoderByType(mime);
              }

              private void noteDecoder(MediaCodec d, int attempt) {
                  try {
                      String n = d.getName();
                      boolean sw = false;
                      for (MediaCodecInfo ci : new MediaCodecList(MediaCodecList.REGULAR_CODECS).getCodecInfos()) {
                          if (ci.getName().equals(n)) {
                              sw = !Probe.isHw(ci);
                              break;
                          }
                      }
                      String tag = n + (sw ? "[sw]" : "[hw]") + "#" + attempt;
                      if (!decNames.contains(tag)) decNames = decNames.length() == 0 ? tag : decNames + "," + tag;
                      if (sw) decSw = true;
                      decAttempt = attempt;
                  } catch (Throwable t) {
                      Log.w(TAG, "noteDecoder failed", t);
                  }
              }

              private static int geti(MediaFormat f, String k) {
                  try {
                      return f.containsKey(k) ? f.getInteger(k) : -1;
                  } catch (Throwable t) {
                      return -1;
                  }
              }

              private void noteSource(String mime, MediaFormat f) {
                  decMime = mime;
                  double fr = 0;
                  if (f.containsKey(MediaFormat.KEY_FRAME_RATE)) {
                      try {
                          fr = f.getInteger(MediaFormat.KEY_FRAME_RATE);
                      } catch (Throwable t) {
                          try {
                              fr = f.getFloat(MediaFormat.KEY_FRAME_RATE);
                          } catch (Throwable t2) {
                              fr = 0;
                          }
                      }
                  }
                  srcFpsMeta = fr;
                  srcFmt = "profile=" + geti(f, MediaFormat.KEY_PROFILE) + " level=" + geti(f, MediaFormat.KEY_LEVEL)
                          + " std=" + geti(f, MediaFormat.KEY_COLOR_STANDARD) + " tr=" + geti(f, MediaFormat.KEY_COLOR_TRANSFER)
                          + " range=" + geti(f, MediaFormat.KEY_COLOR_RANGE) + " bitrate=" + geti(f, MediaFormat.KEY_BIT_RATE);
              }

              private MediaCodec openDecoder(String mime, MediaFormat fmt, Surface s) throws Fail {
                  Exception last = null;
                  for (int attempt = 0; attempt < 2; attempt++) {
                      MediaCodec d = null;
                      try {
                          if (attempt == 0) {
                              fmt.setInteger(MediaFormat.KEY_PRIORITY, 1);
                              fmt.setInteger(MediaFormat.KEY_OPERATING_RATE, Short.MAX_VALUE);
                          } else {
                              fmt.removeKey(MediaFormat.KEY_PRIORITY);
                              fmt.removeKey(MediaFormat.KEY_OPERATING_RATE);
                          }
                          d = createDec(mime);
                          d.configure(fmt, s, null, 0);
                          noteDecoder(d, attempt);
                          return d;
                      } catch (Exception ex) {
                          last = ex;
                          Log.w(TAG, "decoder configure attempt " + attempt + " failed", ex);
                          if (d != null) {
                              try {
                                  d.release();
                              } catch (Throwable ignored) {
                                  // не создан до конца
                              }
                          }
                      }
                  }
                  throw new Fail("decoder_configure", String.valueOf(last), true);
              }

              // ---------- основной сценарий ----------

              private void export() throws Exception {
                  MediaCodecInfo ci = null;
                  if (!noEnc) {
                      ci = findEncoder("video/avc");
                      if (ci == null) throw new Fail("no_encoder", "no AVC encoder", true);
                      encName = ci.getName();
                      encHw = Probe.isHw(ci);
                      MediaCodecInfo.VideoCapabilities vc = ci.getCapabilitiesForType("video/avc").getVideoCapabilities();
                      int wa = Math.max(2, vc.getWidthAlignment());
                      int ha = Math.max(2, vc.getHeightAlignment());
                      outW = Math.max(wa, outW / wa * wa);
                      outH = Math.max(ha, outH / ha * ha);
                      if (!vc.isSizeSupported(outW, outH)) throw new Fail("size_unsupported", outW + "x" + outH, true);
                      if (bitrate <= 0) bitrate = autoBitrate();
                      Range<Integer> rate = vc.getBitrateRange();
                      bitrate = rate.clamp(Integer.valueOf(bitrate)).intValue();
                  } else {
                      outW = Math.max(2, outW / 2 * 2);
                      outH = Math.max(2, outH / 2 * 2);
                  }
                  prepare();
                  if (!noEnc) {
                      long need = (long) (bitrate / 8.0 * totalSec * 1.2) + (32L << 20);
                      long avail = new StatFs(Environment.getExternalStorageDirectory().getPath()).getAvailableBytes();
                      if (avail < need) throw new Fail("no_space", "need " + (need >> 20) + " MB, free " + (avail >> 20) + " MB", false);
                      enc = configureEncoder(ci, "video/avc");
                      encSurface = enc.createInputSurface();
                      enc.start();
                      openOutput();
                      if (threads) startDrainer();
                  }
                  initEgl(noEnc ? null : encSurface);
                  initTexture();
                  initProgram();
                  loadOverlays();
                  for (Clip c : clips) {
                      check();
                      decodeClip(c);
                  }
                  if (!decodeOnly && tailEndTick > k) drawTail();
                  if (framesOut == 0) throw new Fail("no_frames", "no frames produced", true);
                  if (noEnc) return;
                  enc.signalEndOfInputStream();
                  if (threads) {
                      while (drainer.isAlive()) {
                          drainer.join(200);
                          check();
                      }
                      check();
                  } else {
                      drainEncoder(true);
                  }
                  if (!muxStarted) throw new Fail("mux", "muxer never started", true);
                  if (aTrack >= 0) flushAudio(Long.MAX_VALUE);
                  muxer.stop();
                  muxer.release();
                  muxer = null;
                  outSize = pfd.getStatSize();
                  pfd.close();
                  pfd = null;
                  ContentValues cv = new ContentValues();
                  cv.put(MediaStore.MediaColumns.IS_PENDING, 0);
                  br.act.getContentResolver().update(outUri, cv, null, null);
                  outFinal = true;
                  br.registerUri(outUri.toString());
                  Log.i(TAG, "[native-export] frames=" + framesOut + " expected=" + totalTicks + " wait/upd/draw/swap/drain ms="
                          + waitNs / 1000000 + "/" + updNs / 1000000 + "/" + drawNs / 1000000 + "/" + swapNs / 1000000 + "/" + encNs / 1000000);
              }

              // ---------- звук: копия сжатой AAC-дорожки ----------

              /** Читает сжатые AAC-кадры клипа в память (без декодирования). Всё остальное (микс, громкость) - в следующей фазе. */
              private void collectAudio(Clip c, MediaExtractor ex) throws Exception {
                  int at = -1;
                  for (int i = 0; i < ex.getTrackCount(); i++) {
                      String m = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME);
                      if (m != null && m.startsWith("audio/")) {
                          at = i;
                          break;
                      }
                  }
                  if (at < 0) {
                      if (aFmt != null) throw new Fail("audio_mismatch", "clips with and without audio", true);
                      audioMissing = true;
                      return;
                  }
                  if (audioMissing) throw new Fail("audio_mismatch", "clips with and without audio", true);
                  MediaFormat f = ex.getTrackFormat(at);
                  String m = f.getString(MediaFormat.KEY_MIME);
                  if (!"audio/mp4a-latm".equals(m)) throw new Fail("audio_codec", "audio codec " + m + " cannot be copied", true);
                  if (aFmt == null) {
                      aFmt = f;
                  } else if (f.getInteger(MediaFormat.KEY_SAMPLE_RATE) != aFmt.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                          || f.getInteger(MediaFormat.KEY_CHANNEL_COUNT) != aFmt.getInteger(MediaFormat.KEY_CHANNEL_COUNT)) {
                      throw new Fail("audio_mismatch", "audio parameters differ between clips", true);
                  }
                  int cap = f.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE) ? f.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE) : 0;
                  ByteBuffer buf = ByteBuffer.allocate(Math.max(cap, 65536));
                  ex.selectTrack(at);
                  ex.seekTo(c.inUs, MediaExtractor.SEEK_TO_PREVIOUS_SYNC);
                  while (true) {
                      long t = ex.getSampleTime();
                      if (t < 0 || t >= c.outUs) break;
                      buf.clear();
                      int n = ex.readSampleData(buf, 0);
                      if (n < 0) break;
                      if (t >= c.inUs) {
                          Aud a = new Aud();
                          a.pts = (long) c.startUs + (t - c.inUs);
                          a.flags = MediaCodec.BUFFER_FLAG_KEY_FRAME;
                          a.data = new byte[n];
                          buf.position(0);
                          buf.get(a.data, 0, n);
                          aq.add(a);
                          aBytes += n;
                          if (aBytes > (96L << 20)) throw new Fail("audio_big", "audio too large to buffer", true);
                      }
                      ex.advance();
                  }
                  ex.unselectTrack(at);
              }

              /** Пишет в muxer накопленные аудиокадры с метками времени до upToUs (чередование с видео). */
              private void flushAudio(long upToUs) {
                  MediaCodec.BufferInfo bi = new MediaCodec.BufferInfo();
                  while (aPos < aq.size() && aq.get(aPos).pts <= upToUs) {
                      Aud a = aq.get(aPos);
                      aq.set(aPos, null);
                      aPos++;
                      bi.set(0, a.data.length, a.pts, a.flags);
                      muxer.writeSampleData(aTrack, ByteBuffer.wrap(a.data), bi);
                  }
              }

              private void benchDecode() throws Exception {
                  prepare();
                  initEgl(null);
                  initTexture();
                  for (Clip c : clips) {
                      check();
                      decodeClip(c);
                  }
                  if (framesDec == 0) throw new Fail("no_frames", "no frames decoded", true);
              }

              private void openOutput() throws Exception {
                  ContentResolver cr = br.act.getContentResolver();
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, outName);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4");
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, "Movies/Kadr");
                  v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                  outUri = cr.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, v);
                  if (outUri == null) throw new Fail("mediastore", "insert returned null", true);
                  pfd = cr.openFileDescriptor(outUri, "rw");
                  if (pfd == null) throw new Fail("mediastore", "cannot open output", true);
                  muxer = new MediaMuxer(pfd.getFileDescriptor(), MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                  muxer.setOrientationHint(0);
              }

              // ---------- EGL / GL ----------

              private void checkEgl(String what) throws Fail {
                  int e = EGL14.eglGetError();
                  if (e != EGL14.EGL_SUCCESS) throw new Fail("egl", what + " err=0x" + Integer.toHexString(e), true);
              }

              private void initEgl(Surface win) throws Fail {
                  eglDpy = EGL14.eglGetDisplay(EGL14.EGL_DEFAULT_DISPLAY);
                  int[] ver = new int[2];
                  if (!EGL14.eglInitialize(eglDpy, ver, 0, ver, 1)) throw new Fail("egl", "eglInitialize failed", true);
                  eglUp = true;
                  int[] attr;
                  if (win != null) {
                      attr = new int[] {EGL14.EGL_RED_SIZE, 8, EGL14.EGL_GREEN_SIZE, 8, EGL14.EGL_BLUE_SIZE, 8,
                              EGL14.EGL_ALPHA_SIZE, 8, EGL14.EGL_RENDERABLE_TYPE, EGL14.EGL_OPENGL_ES2_BIT,
                              EGL_RECORDABLE_ANDROID, 1, EGL14.EGL_NONE};
                  } else {
                      attr = new int[] {EGL14.EGL_RED_SIZE, 8, EGL14.EGL_GREEN_SIZE, 8, EGL14.EGL_BLUE_SIZE, 8,
                              EGL14.EGL_ALPHA_SIZE, 8, EGL14.EGL_RENDERABLE_TYPE, EGL14.EGL_OPENGL_ES2_BIT,
                              EGL14.EGL_SURFACE_TYPE, EGL14.EGL_PBUFFER_BIT, EGL14.EGL_NONE};
                  }
                  EGLConfig[] cfg = new EGLConfig[1];
                  int[] n = new int[1];
                  if (!EGL14.eglChooseConfig(eglDpy, attr, 0, cfg, 0, 1, n, 0) || n[0] < 1) {
                      throw new Fail("egl", "no suitable EGL config", true);
                  }
                  int[] ca = {EGL14.EGL_CONTEXT_CLIENT_VERSION, 2, EGL14.EGL_NONE};
                  eglCtx = EGL14.eglCreateContext(eglDpy, cfg[0], EGL14.EGL_NO_CONTEXT, ca, 0);
                  checkEgl("eglCreateContext");
                  if (win != null) {
                      eglSurf = EGL14.eglCreateWindowSurface(eglDpy, cfg[0], win, new int[] {EGL14.EGL_NONE}, 0);
                  } else {
                      eglSurf = EGL14.eglCreatePbufferSurface(eglDpy, cfg[0],
                              new int[] {EGL14.EGL_WIDTH, noEnc ? outW : 16, EGL14.EGL_HEIGHT, noEnc ? outH : 16, EGL14.EGL_NONE}, 0);
                  }
                  checkEgl("eglCreateSurface");
                  if (!EGL14.eglMakeCurrent(eglDpy, eglSurf, eglSurf, eglCtx)) throw new Fail("egl", "eglMakeCurrent failed", true);
              }

              private void initTexture() {
                  int[] t = new int[1];
                  GLES20.glGenTextures(1, t, 0);
                  tex = t[0];
                  GLES20.glBindTexture(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, tex);
                  GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR);
                  GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR);
                  GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE);
                  GLES20.glTexParameteri(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE);
                  frameThread = new HandlerThread("kx-frames");
                  frameThread.start();
                  st = new SurfaceTexture(tex);
                  st.setOnFrameAvailableListener(new SurfaceTexture.OnFrameAvailableListener() {
                      public void onFrameAvailable(SurfaceTexture s) {
                          synchronized (frameLock) {
                              frameAvail = true;
                              frameLock.notifyAll();
                          }
                      }
                  }, new Handler(frameThread.getLooper()));
                  decSurface = new Surface(st);
              }

              private static int compile(int type, String src) throws Fail {
                  int s = GLES20.glCreateShader(type);
                  GLES20.glShaderSource(s, src);
                  GLES20.glCompileShader(s);
                  int[] ok = new int[1];
                  GLES20.glGetShaderiv(s, GLES20.GL_COMPILE_STATUS, ok, 0);
                  if (ok[0] == 0) {
                      String log = GLES20.glGetShaderInfoLog(s);
                      GLES20.glDeleteShader(s);
                      throw new Fail("shader", log, true);
                  }
                  return s;
              }

              private int link(String vsSrc, String fsSrc) throws Fail {
                  int vs = compile(GLES20.GL_VERTEX_SHADER, vsSrc);
                  int fs = compile(GLES20.GL_FRAGMENT_SHADER, fsSrc);
                  int p = GLES20.glCreateProgram();
                  GLES20.glAttachShader(p, vs);
                  GLES20.glAttachShader(p, fs);
                  GLES20.glBindAttribLocation(p, 0, "aPos");
                  GLES20.glBindAttribLocation(p, 1, "aTc");
                  GLES20.glLinkProgram(p);
                  int[] ok = new int[1];
                  GLES20.glGetProgramiv(p, GLES20.GL_LINK_STATUS, ok, 0);
                  if (ok[0] == 0) throw new Fail("shader", "link: " + GLES20.glGetProgramInfoLog(p), true);
                  return p;
              }

              private void initProgram() throws Fail {
                  prog = link(VS, FS);
                  uMvp = GLES20.glGetUniformLocation(prog, "uMvp");
                  uTm = GLES20.glGetUniformLocation(prog, "uTm");
                  progOv = link(VS2, FS2);
                  uOvAlpha = GLES20.glGetUniformLocation(progOv, "uAlpha");
                  uOvTex = GLES20.glGetUniformLocation(progOv, "sTex");
                  progFlat = link(VS3, FS3);
                  uFlatColor = GLES20.glGetUniformLocation(progFlat, "uColor");
                  float[] pos = {-1f, -1f, 1f, -1f, -1f, 1f, 1f, 1f};
                  float[] tc = {0f, 0f, 1f, 0f, 0f, 1f, 1f, 1f};
                  posBuf = ByteBuffer.allocateDirect(pos.length * 4).order(ByteOrder.nativeOrder()).asFloatBuffer();
                  posBuf.put(pos).position(0);
                  tcBuf = ByteBuffer.allocateDirect(tc.length * 4).order(ByteOrder.nativeOrder()).asFloatBuffer();
                  tcBuf.put(tc).position(0);
                  ovBuf = ByteBuffer.allocateDirect(16 * 4).order(ByteOrder.nativeOrder()).asFloatBuffer();
                  Arrays.fill(mvp, 0f);
                  mvp[0] = 1f;
                  mvp[5] = 1f;
                  mvp[10] = 1f;
                  mvp[15] = 1f;
                  Arrays.fill(texMatrix, 0f);
                  texMatrix[0] = 1f;
                  texMatrix[5] = 1f;
                  texMatrix[10] = 1f;
                  texMatrix[15] = 1f;
              }

              /** Декодирует PNG наложений и загружает в GL-текстуры (один раз на весь экспорт). */
              private void loadOverlays() throws Fail {
                  for (Ovl o : ovls) {
                      Bitmap bmp = null;
                      try {
                          if (o.src.uri != null) {
                              InputStream in = br.act.getContentResolver().openInputStream(o.src.uri);
                              try {
                                  bmp = BitmapFactory.decodeStream(in);
                              } finally {
                                  if (in != null) in.close();
                              }
                          } else {
                              bmp = BitmapFactory.decodeFile(o.src.file.getPath());
                          }
                      } catch (Exception e) {
                          throw new Fail("overlay_decode", String.valueOf(e), true);
                      }
                      if (bmp == null) throw new Fail("overlay_decode", "cannot decode overlay image", true);
                      int[] t = new int[1];
                      GLES20.glGenTextures(1, t, 0);
                      o.tex = t[0];
                      GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, o.tex);
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR);
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR);
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE);
                      GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE);
                      GLUtils.texImage2D(GLES20.GL_TEXTURE_2D, 0, bmp, 0);
                      double wpx = o.w * outW;
                      o.hpx = o.h > 0 ? o.h * outH : wpx * bmp.getHeight() / Math.max(1, bmp.getWidth());
                      bmp.recycle();
                  }
              }

              private void computeMvp(Clip c) {
                  double a = (double) srcW / srcH;
                  double b = (double) outW / outH;
                  float sx;
                  float sy;
                  if (c.cover) {
                      if (a > b) {
                          sy = 1f;
                          sx = (float) (a / b);
                      } else {
                          sx = 1f;
                          sy = (float) (b / a);
                      }
                  } else if (a > b) {
                      sx = 1f;
                      sy = (float) (b / a);
                  } else {
                      sy = 1f;
                      sx = (float) (a / b);
                  }
                  Arrays.fill(mvp, 0f);
                  mvp[0] = sx;
                  mvp[5] = sy;
                  mvp[10] = 1f;
                  mvp[15] = 1f;
              }

              // ---------- декодирование и кадровая сетка ----------

              private void readDims(MediaFormat of) {
                  int w = of.getInteger(MediaFormat.KEY_WIDTH);
                  int h = of.getInteger(MediaFormat.KEY_HEIGHT);
                  if (of.containsKey("crop-left") && of.containsKey("crop-right")
                          && of.containsKey("crop-top") && of.containsKey("crop-bottom")) {
                      w = of.getInteger("crop-right") - of.getInteger("crop-left") + 1;
                      h = of.getInteger("crop-bottom") - of.getInteger("crop-top") + 1;
                  }
                  // декодер с Surface сам применяет поворот (в матрицу SurfaceTexture), размеры меняем местами сами
                  if (rotation == 90 || rotation == 270) {
                      int t = w;
                      w = h;
                      h = t;
                  }
                  srcW = w;
                  srcH = h;
                  dimsInfo = of.toString();
              }

              private void awaitFrame() throws Fail {
                  long deadline = SystemClock.elapsedRealtime() + 3000;
                  synchronized (frameLock) {
                      while (!frameAvail) {
                          long left = deadline - SystemClock.elapsedRealtime();
                          if (left <= 0) throw new Fail("frame_timeout", "decoder frame did not arrive", true);
                          try {
                              frameLock.wait(left);
                          } catch (InterruptedException e) {
                              throw new Fail("interrupted", "interrupted", true);
                          }
                      }
                      frameAvail = false;
                  }
              }

              private void decodeClip(Clip c) throws Exception {
                  MediaExtractor ex = new MediaExtractor();
                  MediaCodec dec = null;
                  Thread feed = null;
                  try {
                      c.src.open(ex, br.act);
                      ex.selectTrack(c.vtrack);
                      MediaFormat fmt = ex.getTrackFormat(c.vtrack);
                      String mime = fmt.getString(MediaFormat.KEY_MIME);
                      rotation = fmt.containsKey(MediaFormat.KEY_ROTATION) ? fmt.getInteger(MediaFormat.KEY_ROTATION) : 0;
                      noteSource(mime, fmt);
                      ex.seekTo(c.inUs, MediaExtractor.SEEK_TO_PREVIOUS_SYNC);
                      curClip = c;
                      dec = openDecoder(mime, fmt, decSurface);
                      curDec = dec;
                      dec.start();
                      srcW = 0;
                      srcH = 0;
                      k = c.kStart;
                      MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();
                      boolean inDone = threads;
                      boolean outDone = false;
                      boolean have = false;
                      long prevLocal = 0;
                      if (threads) {
                          stopFeed = false;
                          final MediaCodec fdec = dec;
                          final MediaExtractor fex = ex;
                          final long fout = c.outUs;
                          feed = new Thread(new Runnable() {
                              public void run() {
                                  feedLoop(fdec, fex, fout);
                              }
                          }, "kx-feed");
                          feed.start();
                      }
                      while (!outDone) {
                          check();
                          long f0 = System.nanoTime();
                          while (!inDone) {
                              int ii = dec.dequeueInputBuffer(0);
                              if (ii < 0) break;
                              ByteBuffer ib = dec.getInputBuffer(ii);
                              int n = ex.readSampleData(ib, 0);
                              long sampleUs = ex.getSampleTime();
                              if (n < 0 || sampleUs < 0 || sampleUs > c.outUs + GUARD_US) {
                                  dec.queueInputBuffer(ii, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM);
                                  inDone = true;
                              } else {
                                  dec.queueInputBuffer(ii, 0, n, sampleUs, 0);
                                  ex.advance();
                              }
                          }
                          long a = System.nanoTime();
                          if (!threads) feedNs += a - f0;
                          int oi = dec.dequeueOutputBuffer(info, threads ? 2000 : (inDone ? 10000 : 2000));
                          waitNs += System.nanoTime() - a;
                          if (oi == MediaCodec.INFO_TRY_AGAIN_LATER) continue;
                          if (oi == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              readDims(dec.getOutputFormat());
                              continue;
                          }
                          if (oi < 0) continue;
                          pulse();
                          boolean eos = (info.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0;
                          long pts = info.presentationTimeUs;
                          boolean use = info.size > 0 && pts >= c.inUs && pts < c.outUs;
                          if (!use) {
                              dec.releaseOutputBuffer(oi, false);
                              if (eos || (info.size > 0 && pts >= c.outUs)) outDone = true;
                              continue;
                          }
                          long local = pts - c.inUs;
                          if (!decodeOnly && have) emitTicksBefore(c, (prevLocal + local) / 2);
                          a = System.nanoTime();
                          dec.releaseOutputBuffer(oi, true);
                          awaitFrame();
                          st.updateTexImage();
                          st.getTransformMatrix(texMatrix);
                          updNs += System.nanoTime() - a;
                          if (srcW == 0) readDims(dec.getOutputFormat());
                          if (!have && !decodeOnly) computeMvp(c);
                          prevLocal = local;
                          have = true;
                          framesDec++;
                          if (decodeOnly) progress((c.startUs + local) / (totalSec * 1e6), "decode", framesDec);
                          if (eos) outDone = true;
                      }
                      if (!have) throw new Fail("no_frames", "no decodable frames in range", true);
                      if (!decodeOnly) emitTicksBefore(c, Long.MAX_VALUE);
                  } finally {
                      stopFeed = true;
                      if (feed != null) {
                          try {
                              feed.join(5000);
                          } catch (InterruptedException ignored) {
                              // прервано при отмене
                          }
                      }
                      curDec = null;
                      if (dec != null) {
                          try {
                              dec.stop();
                          } catch (Throwable ignored) {
                              // уже остановлен или освобождён сторожем
                          }
                          try {
                              dec.release();
                          } catch (Throwable ignored) {
                              // уже освобождён
                          }
                      }
                      ex.release();
                  }
              }

              /** Выдаёт кадры сетки выходного видео, для которых ближайшим исходным кадром является текущий в текстуре. */
              private void emitTicksBefore(Clip c, long limitUs) throws Exception {
                  while (k < c.kEnd) {
                      double lt = k * 1e6 / fps - c.startUs;
                      if (lt >= limitUs) break;
                      drawTick(k);
                      k++;
                  }
              }

              private void drawTick(long kk) throws Exception {
                  long a = System.nanoTime();
                  GLES20.glViewport(0, 0, outW, outH);
                  GLES20.glClearColor(0f, 0f, 0f, 1f);
                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT);
                  GLES20.glUseProgram(prog);
                  GLES20.glActiveTexture(GLES20.GL_TEXTURE0);
                  GLES20.glBindTexture(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, tex);
                  GLES20.glUniformMatrix4fv(uMvp, 1, false, mvp, 0);
                  GLES20.glUniformMatrix4fv(uTm, 1, false, texMatrix, 0);
                  posBuf.position(0);
                  tcBuf.position(0);
                  GLES20.glEnableVertexAttribArray(0);
                  GLES20.glVertexAttribPointer(0, 2, GLES20.GL_FLOAT, false, 8, posBuf);
                  GLES20.glEnableVertexAttribArray(1);
                  GLES20.glVertexAttribPointer(1, 2, GLES20.GL_FLOAT, false, 8, tcBuf);
                  GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4);
                  double t = kk / fps;
                  drawShade(t);
                  drawOverlays(t);
                  if (glFinish) GLES20.glFinish();
                  long b = System.nanoTime();
                  drawNs += b - a;
                  if (noEnc) {
                      GLES20.glFinish();
                  } else {
                      EGLExt.eglPresentationTimeANDROID(eglDpy, eglSurf, Math.round(kk * 1e9 / fps));
                      if (!EGL14.eglSwapBuffers(eglDpy, eglSurf)) throw new Fail("egl_swap", "eglSwapBuffers failed", true);
                  }
                  swapNs += System.nanoTime() - b;
                  framesOut++;
                  if (!noEnc && !threads) drainEncoder(false);
                  pulse();
                  progress(totalTicks > 0 ? (double) framesOut / totalTicks : 0, "encode", framesOut);
              }

              /** Чёрный хвост после основы: наложения живут и за её концом (как «чёрный хвост» в редакторе). */
              private void drawTail() throws Exception {
                  while (k < tailEndTick) {
                      check();
                      long a = System.nanoTime();
                      GLES20.glViewport(0, 0, outW, outH);
                      GLES20.glClearColor(0f, 0f, 0f, 1f);
                      GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT);
                      drawOverlays(k / fps);
                      if (glFinish) GLES20.glFinish();
                      long b = System.nanoTime();
                      drawNs += b - a;
                      if (noEnc) {
                          GLES20.glFinish();
                      } else {
                          EGLExt.eglPresentationTimeANDROID(eglDpy, eglSurf, Math.round(k * 1e9 / fps));
                          if (!EGL14.eglSwapBuffers(eglDpy, eglSurf)) throw new Fail("egl_swap", "eglSwapBuffers failed", true);
                      }
                      swapNs += System.nanoTime() - b;
                      framesOut++;
                      if (!noEnc && !threads) drainEncoder(false);
                      pulse();
                      progress(totalTicks > 0 ? (double) framesOut / totalTicks : 0, "encode", framesOut);
                      k++;
                  }
              }

              /** Переход Kadr: затемнение (или осветление) к концу клипа и из цвета в начале следующего. Формула как в drawTransitionShade. */
              private void drawShade(double t) {
                  Clip c = curClip;
                  if (c == null || (c.trOut == null && c.trIn == null)) return;
                  double start = c.startUs / 1e6;
                  double len = (c.outUs - c.inUs) / 1e6;
                  double alpha = 0;
                  boolean white = false;
                  if (c.trOut != null) {
                      double remain = start + len - t;
                      if (remain > 0 && remain < c.trOutDur) {
                          alpha = Math.max(alpha, 1 - remain / c.trOutDur);
                          white = "white".equals(c.trOut);
                      }
                  }
                  if (c.trIn != null) {
                      double el = t - start;
                      if (el > 0 && el < c.trInDur) {
                          double al = 1 - el / c.trInDur;
                          if (al > alpha) {
                              alpha = al;
                              white = "white".equals(c.trIn);
                          }
                      }
                  }
                  if (alpha <= 0.01) return;
                  float al = (float) Math.min(1.0, alpha);
                  float col = white ? al : 0f;
                  GLES20.glEnable(GLES20.GL_BLEND);
                  GLES20.glBlendFunc(GLES20.GL_ONE, GLES20.GL_ONE_MINUS_SRC_ALPHA);
                  GLES20.glUseProgram(progFlat);
                  GLES20.glUniform4f(uFlatColor, col, col, col, al);
                  posBuf.position(0);
                  GLES20.glEnableVertexAttribArray(0);
                  GLES20.glVertexAttribPointer(0, 2, GLES20.GL_FLOAT, false, 8, posBuf);
                  GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4);
                  GLES20.glDisable(GLES20.GL_BLEND);
              }

              /** Наложения поверх кадра: центр (x,y) и ширина w - доли кадра, поворот по часовой стрелке в градусах. */
              private void drawOverlays(double t) {
                  boolean any = false;
                  for (Ovl o : ovls) {
                      if (t < o.t0 - 0.001 || t > o.t1 + 0.001) continue;
                      double fade = 1;
                      if (o.fi > 0) fade = Math.min(fade, (t - o.t0) / o.fi);
                      if (o.fo > 0) fade = Math.min(fade, (o.t1 - t) / o.fo);
                      double alpha = o.opacity * Math.max(0, Math.min(1, fade));
                      if (alpha <= 0.01) continue;
                      if (!any) {
                          any = true;
                          GLES20.glEnable(GLES20.GL_BLEND);
                          GLES20.glBlendFunc(GLES20.GL_ONE, GLES20.GL_ONE_MINUS_SRC_ALPHA);
                          GLES20.glUseProgram(progOv);
                          GLES20.glActiveTexture(GLES20.GL_TEXTURE0);
                          GLES20.glUniform1i(uOvTex, 0);
                      }
                      double cx = o.x * outW;
                      double cy = o.y * outH;
                      double hw = o.w * outW / 2;
                      double hh = o.hpx / 2;
                      double r = Math.toRadians(o.rot);
                      double cs = Math.cos(r);
                      double sn = Math.sin(r);
                      // углы изображения (экранные координаты, y вниз): левый верх, правый верх, левый низ, правый низ
                      double[] dx = {-hw, hw, -hw, hw};
                      double[] dy = {-hh, -hh, hh, hh};
                      float[] u = {0f, 1f, 0f, 1f};
                      float[] v = {0f, 0f, 1f, 1f};
                      for (int i = 0; i < 4; i++) {
                          double px = cx + dx[i] * cs - dy[i] * sn;
                          double py = cy + dx[i] * sn + dy[i] * cs;
                          ovV[i * 4] = (float) (px / outW * 2.0 - 1.0);
                          ovV[i * 4 + 1] = (float) (1.0 - py / outH * 2.0);
                          ovV[i * 4 + 2] = u[i];
                          ovV[i * 4 + 3] = v[i];
                      }
                      ovBuf.position(0);
                      ovBuf.put(ovV);
                      GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, o.tex);
                      GLES20.glUniform1f(uOvAlpha, (float) Math.min(1.0, alpha));
                      ovBuf.position(0);
                      GLES20.glEnableVertexAttribArray(0);
                      GLES20.glVertexAttribPointer(0, 2, GLES20.GL_FLOAT, false, 16, ovBuf);
                      ovBuf.position(2);
                      GLES20.glEnableVertexAttribArray(1);
                      GLES20.glVertexAttribPointer(1, 2, GLES20.GL_FLOAT, false, 16, ovBuf);
                      GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4);
                  }
                  if (any) GLES20.glDisable(GLES20.GL_BLEND);
              }

              private void progress(double p, String stage, long frames) {
                  long now = SystemClock.elapsedRealtime();
                  if (now - lastEmit < 100) return;
                  lastEmit = now;
                  br.emit(KxBridge.o("type", "progress", "job", jobId, "p", Math.min(1.0, p), "stage", stage,
                          "fps", Math.round(frames * 10000.0 / Math.max(1, now - t0)) / 10.0));
              }

              private void drainEncoder(boolean endOfStream) throws Exception {
                  long waitStart = SystemClock.elapsedRealtime();
                  while (true) {
                      int idx = enc.dequeueOutputBuffer(binfo, endOfStream ? 10000 : 0);
                      if (idx == MediaCodec.INFO_TRY_AGAIN_LATER) {
                          if (!endOfStream) break;
                          if (stopDrain) return;
                          check();
                          if (SystemClock.elapsedRealtime() - waitStart > STALL_MS) throw new Fail("timeout", "encoder EOS timeout", true);
                          continue;
                      }
                      long a = System.nanoTime();
                      if (idx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          vTrack = muxer.addTrack(enc.getOutputFormat());
                          if (aFmt != null) aTrack = muxer.addTrack(aFmt);
                          muxer.start();
                          muxStarted = true;
                      } else if (idx >= 0) {
                          ByteBuffer buf = enc.getOutputBuffer(idx);
                          if ((binfo.flags & MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) binfo.size = 0;
                          if (binfo.size > 0 && muxStarted && buf != null) {
                              buf.position(binfo.offset);
                              buf.limit(binfo.offset + binfo.size);
                              long mx0 = System.nanoTime();
                              muxer.writeSampleData(vTrack, buf, binfo);
                              if (aTrack >= 0) flushAudio(binfo.presentationTimeUs + 700000L);
                              muxNs += System.nanoTime() - mx0;
                          }
                          enc.releaseOutputBuffer(idx, false);
                          waitStart = SystemClock.elapsedRealtime();
                          pulse();
                          if ((binfo.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) {
                              encNs += System.nanoTime() - a;
                              break;
                          }
                      }
                      encNs += System.nanoTime() - a;
                  }
              }

              private void startDrainer() {
                  stopDrain = false;
                  drainer = new Thread(new Runnable() {
                      public void run() {
                          try {
                              drainEncoder(true);
                          } catch (Throwable t) {
                              if (!stopDrain) bgFail = t;
                          }
                      }
                  }, "kx-drain");
                  drainer.start();
              }

              /** Поток подачи входа декодера: чтение сэмплов и queueInputBuffer не мешают отрисовке и энкодеру. */
              private void feedLoop(MediaCodec dec, MediaExtractor ex, long outUs) {
                  try {
                      while (!stopFeed && !cancelled && !aborted) {
                          int ii = dec.dequeueInputBuffer(2000);
                          if (ii < 0) continue;
                          long a = System.nanoTime();
                          ByteBuffer ib = dec.getInputBuffer(ii);
                          int n = ex.readSampleData(ib, 0);
                          long sampleUs = ex.getSampleTime();
                          if (n < 0 || sampleUs < 0 || sampleUs > outUs + GUARD_US) {
                              dec.queueInputBuffer(ii, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM);
                              feedNs += System.nanoTime() - a;
                              break;
                          }
                          dec.queueInputBuffer(ii, 0, n, sampleUs, 0);
                          ex.advance();
                          feedNs += System.nanoTime() - a;
                      }
                  } catch (Throwable t) {
                      if (!stopFeed) bgFail = t;
                  }
              }

              // ---------- освобождение ресурсов ----------

              private void cleanup(boolean ok) {
                  stopDrain = true;
                  stopFeed = true;
                  if (drainer != null) {
                      try {
                          drainer.join(3000);
                      } catch (InterruptedException ignored) {
                          // прервано
                      }
                  }
                  if (eglUp) {
                      try {
                          EGL14.eglMakeCurrent(eglDpy, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_CONTEXT);
                          if (eglSurf != null) EGL14.eglDestroySurface(eglDpy, eglSurf);
                          if (eglCtx != null) EGL14.eglDestroyContext(eglDpy, eglCtx);
                          EGL14.eglReleaseThread();
                          EGL14.eglTerminate(eglDpy);
                      } catch (Throwable t) {
                          Log.w(TAG, "egl cleanup", t);
                      }
                      eglUp = false;
                  }
                  try {
                      if (decSurface != null) decSurface.release();
                      if (st != null) st.release();
                  } catch (Throwable t) {
                      Log.w(TAG, "surface cleanup", t);
                  }
                  try {
                      if (encSurface != null) encSurface.release();
                  } catch (Throwable ignored) {
                      // уже освобождён
                  }
                  MediaCodec e = enc;
                  enc = null;
                  if (e != null) {
                      try {
                          e.stop();
                      } catch (Throwable ignored) {
                          // не запущен
                      }
                      try {
                          e.release();
                      } catch (Throwable ignored) {
                          // уже освобождён
                      }
                  }
                  try {
                      if (muxer != null) muxer.release();
                  } catch (Throwable t) {
                      Log.w(TAG, "muxer cleanup", t);
                  }
                  try {
                      if (pfd != null) pfd.close();
                  } catch (Throwable ignored) {
                      // уже закрыт
                  }
                  if (!outFinal && outUri != null) {
                      try {
                          br.act.getContentResolver().delete(outUri, null, null);
                      } catch (Throwable t) {
                          Log.w(TAG, "mediastore cleanup", t);
                      }
                      outUri = null;
                  }
                  if (frameThread != null) frameThread.quitSafely();
              }
          }
