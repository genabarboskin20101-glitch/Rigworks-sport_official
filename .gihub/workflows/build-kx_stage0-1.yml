              public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback c) {
                  orig.onGeolocationPermissionsShowPrompt(origin, c);
              }

              @Override
              public void onGeolocationPermissionsHidePrompt() {
                  orig.onGeolocationPermissionsHidePrompt();
              }

              @Override
              public void onPermissionRequest(PermissionRequest r) {
                  orig.onPermissionRequest(r);
              }

              @Override
              public void onPermissionRequestCanceled(PermissionRequest r) {
                  orig.onPermissionRequestCanceled(r);
              }

              @Override
              public boolean onConsoleMessage(ConsoleMessage m) {
                  return orig.onConsoleMessage(m);
              }

              @Override
              public Bitmap getDefaultVideoPoster() {
                  return orig.getDefaultVideoPoster();
              }

              @Override
              public View getVideoLoadingProgressView() {
                  return orig.getVideoLoadingProgressView();
              }

              @Override
              public void getVisitedHistory(ValueCallback<String[]> cb) {
                  orig.getVisitedHistory(cb);
