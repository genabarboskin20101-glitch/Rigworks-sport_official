              static JSONObject info(Context ctx, Src src) throws Exception {
                  MediaExtractor ex = new MediaExtractor();
                  try {
                      src.open(ex, ctx);
                      int vi = -1;
                      int ai = -1;
                      for (int i = 0; i < ex.getTrackCount(); i++) {
                          String m = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME);
                          if (m == null) continue;
                          if (vi < 0 && m.startsWith("video/")) vi = i;
                          else if (ai < 0 && m.startsWith("audio/")) ai = i;
                      }
                      JSONObject o = new JSONObject();
                      long dur = 0;
                      if (vi >= 0) {
                          MediaFormat f = ex.getTrackFormat(vi);
                          o.put("vcodec", f.getString(MediaFormat.KEY_MIME));
                          o.put("w", f.getInteger(MediaFormat.KEY_WIDTH));
                          o.put("h", f.getInteger(MediaFormat.KEY_HEIGHT));
                          o.put("rotation", f.containsKey(MediaFormat.KEY_ROTATION) ? f.getInteger(MediaFormat.KEY_ROTATION) : 0);
                          if (f.containsKey(MediaFormat.KEY_DURATION)) dur = f.getLong(MediaFormat.KEY_DURATION);
                          o.put("fpsMeta", num(f, MediaFormat.KEY_FRAME_RATE));
                          o.put("bitrateMeta", num(f, MediaFormat.KEY_BIT_RATE));
                          o.put("profile", num(f, MediaFormat.KEY_PROFILE));
                          o.put("level", num(f, MediaFormat.KEY_LEVEL));
                          o.put("colorStd", num(f, MediaFormat.KEY_COLOR_STANDARD));
                          o.put("colorTransfer", num(f, MediaFormat.KEY_COLOR_TRANSFER));
                          o.put("colorRange", num(f, MediaFormat.KEY_COLOR_RANGE));
                          // реальный fps и признак VFR - по меткам времени первых кадров (только демукс, без декодирования)
                          ex.selectTrack(vi);
                          ArrayList<Long> ts = new ArrayList<Long>();
                          for (int i = 0; i < 300; i++) {
                              long t = ex.getSampleTime();
                              if (t < 0) break;
                              ts.add(t);
                              if (!ex.advance()) break;
                          }
                          Collections.sort(ts);
                          if (ts.size() > 2) {
                              ArrayList<Long> d = new ArrayList<Long>();
                              for (int i = 1; i < ts.size(); i++) d.add(ts.get(i) - ts.get(i - 1));
                              Collections.sort(d);
                              long med = d.get(d.size() / 2);
                              long max = d.get(d.size() - 1);
                              if (med > 0) o.put("fps", Math.round(1e8 / med) / 100.0);
                              o.put("vfr", med > 0 && max > med * 1.6);
                          }
                          ex.unselectTrack(vi);
                      }
                      o.put("hasAudio", ai >= 0);
                      if (ai >= 0) {
                          MediaFormat f = ex.getTrackFormat(ai);
                          o.put("acodec", f.getString(MediaFormat.KEY_MIME));
                          o.put("sampleRate", f.containsKey(MediaFormat.KEY_SAMPLE_RATE) ? f.getInteger(MediaFormat.KEY_SAMPLE_RATE) : 0);
                          o.put("channels", f.containsKey(MediaFormat.KEY_CHANNEL_COUNT) ? f.getInteger(MediaFormat.KEY_CHANNEL_COUNT) : 0);
                          if (dur == 0 && f.containsKey(MediaFormat.KEY_DURATION)) dur = f.getLong(MediaFormat.KEY_DURATION);
                      }
                      o.put("durationUs", dur);
                      return o;
                  } finally {
                      ex.release();
                  }
              }
