<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Праздничная коробка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #080b2f;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #080b2f;
    }
    picture, img {
      display: block;
      width: 100%;
      height: 100%;
    }
    img {
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }
    @media (max-width: 767px) {
      img { object-fit: cover; }
    }

    .greeting-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 32px;
      text-align: center;
      background: radial-gradient(circle at center, rgba(8,11,47,0.62) 0%, rgba(8,11,47,0.4) 55%, rgba(8,11,47,0.08) 100%);
      overflow: hidden;
    }
    .greeting-text {
      margin: 0;
      max-width: 880px;
      font-family: 'Marck Script', cursive;
      font-weight: 400;
      font-size: clamp(30px, 6vw, 62px);
      line-height: 1.5;
      color: #ffe9b8;
      text-shadow: 0 0 18px rgba(255, 210, 130, 0.55), 0 0 42px rgba(255, 170, 70, 0.28);
      letter-spacing: 0.5px;
    }
    .greeting-text .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(26px) scale(0.9);
      animation: wordIn 0.8s cubic-bezier(.22,.8,.24,1) forwards;
    }
    .greeting-text .word.emoji {
      font-family: system-ui, "Segoe UI Emoji", sans-serif;
      animation: emojiPop 0.8s cubic-bezier(.22,.8,.24,1) forwards;
    }
    .greeting-text .word:nth-child(1) { animation-delay: .15s; }
    .greeting-text .word:nth-child(2) { animation-delay: .28s; }
    .greeting-text .word:nth-child(3) { animation-delay: .41s; }
    .greeting-text .word:nth-child(4) { animation-delay: .54s; }
    .greeting-text .word:nth-child(5) { animation-delay: .67s; }
    .greeting-text .word:nth-child(6) { animation-delay: .80s; }
    .greeting-text .word:nth-child(7) { animation-delay: .93s; }
    .greeting-text .word:nth-child(8) { animation-delay: 1.06s; }
    .greeting-text .word:nth-child(9) { animation-delay: 1.19s; }
    .greeting-text .word:nth-child(10) { animation-delay: 1.32s; }
    .greeting-text .word:nth-child(11) { animation-delay: 1.45s; }
    .greeting-text .word:nth-child(12) { animation-delay: 1.6s; }
    @keyframes wordIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes emojiPop {
      0% { opacity: 0; transform: scale(0.2) rotate(-20deg); }
      55% { opacity: 1; transform: scale(1.35) rotate(10deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    .sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffe08a;
      box-shadow: 0 0 8px 3px rgba(255, 224, 138, 0.85);
      opacity: 0;
      animation: sparkleFloat 3.6s ease-in-out infinite;
    }
    @keyframes sparkleFloat {
      0% { opacity: 0; transform: translateY(10px) scale(0.5); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-130px) scale(1.2); }
    }
    .s1 { left: 12%; top: 70%; animation-delay: .2s; }
    .s2 { left: 22%; top: 30%; animation-delay: 1.1s; }
    .s3 { left: 35%; top: 80%; animation-delay: .6s; }
    .s4 { left: 48%; top: 20%; animation-delay: 1.8s; }
    .s5 { left: 60%; top: 75%; animation-delay: .9s; }
    .s6 { left: 72%; top: 28%; animation-delay: 1.5s; }
    .s7 { left: 85%; top: 65%; animation-delay: .4s; }
    .s8 { left: 90%; top: 35%; animation-delay: 2.1s; }
    @media (max-width: 480px) {
      .greeting-text { font-size: clamp(26px, 7.5vw, 40px); }
    }

    .horn-button {
      display: inline-block;
      margin-top: 22px;
      padding: 10px;
      background: none;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      animation: hornAppear 0.7s ease-out 1.9s forwards;
    }
    .horn-button:focus-visible {
      outline: 2px solid #ffe08a;
      outline-offset: 4px;
      border-radius: 12px;
    }
    .horn {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 176px;
      height: 46px;
    }
    .horn-cone {
      position: relative;
      z-index: 2;
      width: 0;
      height: 0;
      border-top: 23px solid transparent;
      border-bottom: 23px solid transparent;
      border-left: 40px solid #f2c14e;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
    }
    .horn-ball {
      position: absolute;
      left: -6px;
      top: 50%;
      width: 16px;
      height: 16px;
      margin-top: -8px;
      border-radius: 50%;
      background: #ffe9b8;
      z-index: 3;
      box-shadow: 0 0 6px rgba(255, 233, 184, 0.85);
    }
    .horn-tongue {
      position: absolute;
      left: 38px;
      top: 50%;
      height: 20px;
      width: 96px;
      margin-top: -10px;
      border-radius: 10px;
      background: repeating-linear-gradient(90deg, #ff5d5d 0 10px, #ffe9b8 10px 20px);
      transform-origin: left center;
      transform: scaleX(0.15);
    }
    .horn-tip {
      position: absolute;
      right: -7px;
      top: 50%;
      width: 14px;
      height: 14px;
      margin-top: -7px;
      border-radius: 50%;
      background: #ff5d5d;
    }
    .horn-button.is-playing .horn-tongue {
      animation: hornUnroll 1s cubic-bezier(.16,.9,.32,1.05);
    }
    .horn-button.is-playing .horn {
      animation: hornShake 0.4s ease;
    }
    @keyframes hornUnroll {
      0% { transform: scaleX(0.15); }
      35% { transform: scaleX(1.08) rotate(-2deg); }
      55% { transform: scaleX(1) rotate(2deg); }
      75% { transform: scaleX(1) rotate(-1deg); }
      100% { transform: scaleX(0.15); }
    }
    @keyframes hornShake {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-4deg); }
      60% { transform: rotate(3deg); }
    }
    @keyframes hornAppear {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .horn-caption {
      display: inline-block;
      appearance: none;
      -webkit-appearance: none;
      margin: 8px 0 0;
      padding: 6px 16px;
      border: none;
      border-radius: 999px;
      background: rgba(255, 233, 184, 0.12);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0.4px;
      color: rgba(255, 233, 184, 0.85);
      cursor: pointer;
      opacity: 0;
      animation: hornAppear 0.7s ease-out 2.1s forwards;
      transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .horn-caption:hover {
      background: rgba(255, 233, 184, 0.22);
      color: #ffe9b8;
    }
    .horn-caption:active {
      transform: translateY(2px) scale(0.94);
      background: rgba(255, 233, 184, 0.3);
      box-shadow: 0 0 0 rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .horn-caption:focus-visible {
      outline: 2px solid #ffe08a;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="greeting-overlay" id="greetingOverlay">
    <p class="greeting-text">
      <span class="word">Привет!</span>
      <span class="word">Ты</span>
      <span class="word">приглашен(а)</span>
      <span class="word">на</span>
      <span class="word">мой</span>
      <span class="word">день</span>
      <span class="word">рождения,</span>
      <span class="word">жду</span>
      <span class="word">тебя</span>
      <span class="word">на</span>
      <span class="word">празднике!</span>
      <span class="word emoji">🥳</span>
    </p>

    <button type="button" class="horn-button" id="hornButton" aria-label="Нажми, чтобы услышать праздничную дудку">
      <span class="horn">
        <span class="horn-cone"></span>
        <span class="horn-ball"></span>
        <span class="horn-tongue">
          <span class="horn-tip"></span>
        </span>
      </span>
    </button>
    <button type="button" class="horn-caption" id="hornCaption" aria-label="Нажми, чтобы дудка дудела">нажми, чтобы дудеть</button>

  <script>
    // extra layer on top of the CSS user-select: none rule above
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('selectstart', function (e) { e.preventDefault(); });
    document.addEventListener('copy', function (e) { e.preventDefault(); });

    var hornButton = document.getElementById('hornButton');
    var hornCaption = document.getElementById('hornCaption');
    var hornSound = document.getElementById('hornSound');
    var hornSource = hornSound ? hornSound.querySelector('source') : null;

    var AudioContextCtor = window.AudioContext || window.webkitAudioContext;
    var audioCtx = AudioContextCtor ? new AudioContextCtor() : null;
    var hornBufferPromise = null;

    if (hornSound) {
      // fallback path only: keep pitch tied to rate if Web Audio isn't available
      hornSound.preservesPitch = false;
      hornSound.mozPreservesPitch = false;
      hornSound.webkitPreservesPitch = false;
    }

    function loadHornBuffer() {
      if (hornBufferPromise) return hornBufferPromise;
      if (!audioCtx || !hornSource) {
        return Promise.reject(new Error('Web Audio unavailable'));
      }
      hornBufferPromise = fetch(hornSource.src)
        .then(function (res) { return res.arrayBuffer(); })
        .then(function (data) { return audioCtx.decodeAudioData(data); });
      return hornBufferPromise;
    }

    // independent random speed (playbackRate) and random extra pitch shift (detune)
    function playHornViaWebAudio(randomize) {
      return loadHornBuffer().then(function (buffer) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(function () {});
        }
        var node = audioCtx.createBufferSource();
        node.buffer = buffer;
        node.playbackRate.value = randomize ? 0.75 + Math.random() * 0.6 : 1;
        node.detune.value = randomize ? Math.random() * 1000 - 500 : 0;
        node.connect(audioCtx.destination);
        node.start(0);
      });
    }

    function playHornViaAudioElement(randomize) {
      if (!hornSound) return;
      try {
        hornSound.currentTime = 0;
        hornSound.playbackRate = randomize ? 0.75 + Math.random() * 0.6 : 1;
        var playPromise = hornSound.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function () {});
        }
      } catch (e) {}
    }

    function playHorn(randomize) {
      if (!hornButton) return;
      hornButton.classList.remove('is-playing');
      // force a reflow so the unroll animation can restart on repeated clicks
      void hornButton.offsetWidth;
      hornButton.classList.add('is-playing');

      if (audioCtx) {
        playHornViaWebAudio(randomize).catch(function () {
          playHornViaAudioElement(randomize);
        });
      } else {
        playHornViaAudioElement(randomize);
      }
    }

    if (hornButton) {
      hornButton.addEventListener('click', function () {
        playHorn(true);
      });
    }

    if (hornCaption) {
      hornCaption.addEventListener('click', function () {
        playHorn(true);
      });
    }

    // play once automatically right as the entrance text finishes appearing
    window.setTimeout(function () {
      playHorn(false);
    }, 2500);
  </script>
