<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIGWORKS — интернет-магазин спортивного инвентаря</title>
    <meta name="description" content="RIGWORKS — каталог инвентаря и экипировки для тренировок: гантели, штанги, мячи и аксессуары с доставкой по России.">
    <meta name="theme-color" content="#111310">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6f8a5a;
            --primary-dark: #33402a;
            --dark: #111310;
            --dark-2: #1a1c17;
            --dark-3: #22241e;
            --steel: #4a4e42;
            --light: #d6d3c6;
            --white: #f2f0e6;
            --gray: #888c7e;
            --shadow: 5px 5px 0 rgba(0, 0, 0, 0.55);
            --shadow-hover: 7px 7px 0 var(--primary-dark);
            --transition: 0.15s ease-out;
            --transition-soft: 0.38s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-press: 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            --radius: 3px;
            --radius-sm: 2px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
            overflow-x: hidden;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--dark);
            color: var(--light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ---------- ICONS (inline SVG sprite, no external font/CDN) ---------- */
        .icon {
            width: 1em;
            height: 1em;
            display: inline-block;
            flex-shrink: 0;
            vertical-align: -0.125em;
            fill: none;
            stroke: currentColor;
        }

        /* ---------- FILM GRAIN OVERLAY ---------- */
        .grain-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.05;
            mix-blend-mode: overlay;
            filter: url(#grain-filter);
        }

        /* ---------- HEADER ---------- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--dark);
            border-bottom: 2px solid var(--steel);
            transition: var(--transition);
            padding: 0 5%;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header.scrolled {
            border-bottom-color: var(--primary-dark);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.7);
        }

        .logo {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .logo .icon {
            color: var(--primary);
            font-size: 1.8rem;
            transition: var(--transition);
        }

        .logo:hover {
            color: var(--primary);
        }
        .logo:hover .icon {
            transform: rotate(-15deg) scale(1.1);
        }
        .logo span {
            color: var(--primary);
        }

        .nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav a {
            color: var(--gray);
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
            padding: 6px 0;
        }

        .nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: var(--transition);
            border-radius: 2px;
        }

        .nav a:hover,
        .nav a.active {
            color: var(--white);
        }
        .nav a:hover::after,
        .nav a.active::after {
            width: 100%;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .cart-btn {
            background: none;
            border: 2px solid var(--primary);
            color: var(--primary);
            width: 46px;
            height: 46px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: var(--transition);
        }

        .cart-btn:hover {
            background: var(--primary);
            color: var(--dark);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .search-btn {
            background: var(--primary);
            border: 2px solid var(--primary);
            color: var(--white);
            width: 46px;
            height: 46px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--transition-press), background var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition);
        }
        @media (hover: hover) and (pointer: fine) {
            .search-btn:hover {
                background: var(--primary-dark);
                border-color: var(--primary);
                color: var(--white);
                transform: translateY(-3px);
                box-shadow: var(--shadow-hover);
            }
        }
        .search-btn[aria-expanded="true"] {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 0 0 3px rgba(111,138,90,0.12), var(--shadow-hover);
        }

        .section-search {
            position: fixed;
            top: 76px;
            left: 0;
            right: 0;
            z-index: 999;
            padding: 10px 5%;
            background: rgba(17,19,16,0.97);
            border-bottom: 1px solid rgba(111,138,90,0.28);
            transform: translateY(-125%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: transform 0.46s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.30s ease, visibility 0.46s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            will-change: transform, opacity;
        }
        .section-search.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .section-search-inner {
            transform: translateY(-8px) scale(0.985);
            opacity: 0;
            transition: transform 0.46s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease, border-color var(--transition);
            will-change: transform, opacity;
        }
        .section-search.active .section-search-inner {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .section-search-inner {
            max-width: 860px;
            margin: 0 auto;
            height: 46px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            background: var(--dark-2);
            border: 2px solid var(--steel);
            border-radius: var(--radius-sm);
        }
        .section-search:focus-within .section-search-inner { border-color: var(--primary); }
        .section-search-icon { color: var(--primary); font-size: 1.1rem; }
        .section-search-input {
            flex: 1;
            min-width: 0;
            background: none;
            border: 0;
            outline: 0;
            color: var(--white);
            font: 400 0.95rem 'Roboto', sans-serif;
        }
        .section-search-input::placeholder { color: var(--gray); }
        .section-search-clear {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            background: none;
            border: 0;
            color: var(--gray);
            cursor: pointer;
            display: grid;
            place-items: center;
            border-radius: var(--radius-sm);
        }
        .section-search-clear:hover { color: var(--white); background: rgba(255,255,255,0.05); }

        .search-filter-hidden { display: none !important; }

        .cart-count {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--white);
            color: var(--dark);
            font-size: 0.7rem;
            font-weight: 700;
            width: 22px;
            height: 22px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--dark);
            font-family: 'Oswald', sans-serif;
            transition: var(--transition);
        }

        .burger {
            display: none;
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.6rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .burger:hover {
            color: var(--primary);
        }

        /* ---------- HERO ---------- */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #111310 0%, #1a1c17 40%, #111310 100%);
            position: relative;
            overflow: hidden;
            padding: 100px 5% 60px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(111, 138, 90, 0.14) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(74, 78, 66, 0.16) 0%, transparent 40%);
            animation: heroGlow 15s ease-in-out infinite;
        }
        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.55) 100%);
            pointer-events: none;
        }

        @keyframes heroGlow {
            0%,
            100% {
                transform: translate(0, 0);
            }
            33% {
                transform: translate(2%, 3%);
            }
            66% {
                transform: translate(-1%, -2%);
            }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 850px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-badge {
            display: inline-block;
            background: rgba(111, 138, 90, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            padding: 8px 20px;
            border-radius: var(--radius);
            margin-bottom: 25px;
            font-weight: 500;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .hero h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1.05;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: var(--white);
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .hero h1 span {
            color: var(--primary);
            position: relative;
            display: inline-block;
        }

        .hero h1 span::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            height: 8px;
            background: var(--primary);
            opacity: 0.3;
            border-radius: 4px;
            z-index: -1;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto 35px;
            font-weight: 300;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-decoration: none;
            border-radius: var(--radius);
            transition: var(--transition);
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--primary-dark);
            color: var(--white);
            border-color: var(--primary-dark);
            box-shadow: var(--shadow);
        }
        .btn-primary:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--dark);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .btn-outline {
            background: transparent;
            color: var(--white);
            border: 2px solid var(--white);
        }
        .btn-outline:hover {
            background: var(--white);
            color: var(--dark);
            transform: translateY(-3px);
            box-shadow: 7px 7px 0 var(--steel);
        }

        /* ---------- FEATURES ---------- */
        .features {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            padding: 70px 5%;
            background: var(--dark-2);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .feature-card {
            text-align: center;
            padding: 25px 15px;
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid var(--steel);
            transition: var(--transition);
        }
        .feature-card:hover {
            background: rgba(111, 138, 90, 0.07);
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        .feature-card .icon {
            font-size: 2.4rem;
            color: var(--primary);
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .feature-card h3 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--white);
        }
        .feature-card p {
            font-size: 0.85rem;
            color: var(--gray);
            font-weight: 300;
        }

        /* ---------- CATALOG ---------- */
        .catalog {
            padding: 80px 5%;
            background: var(--dark);
        }

        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-header h2 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--white);
            margin-bottom: 10px;
        }

        .section-header h2 span {
            color: var(--primary);
        }

        .section-header p {
            color: var(--gray);
            font-size: 1rem;
            font-weight: 300;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--dark-2);
            border-radius: var(--radius);
            overflow: hidden;
            border: 2px solid var(--steel);
            transition: var(--transition);
            position: relative;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: var(--shadow-hover);
        }

        .product-image {
            width: 100%;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, #1a1c17, #22241e);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .product-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(17, 19, 16, 0.82));
        }

        .product-card:hover .product-image {
            background: linear-gradient(135deg, #1e201a, #2a2c24);
        }

        .product-image .emoji {
            font-size: 5.5rem;
            position: relative;
            z-index: 1;
            transition: var(--transition);
            filter: grayscale(100%) sepia(50%) hue-rotate(65deg) saturate(220%) brightness(0.88) contrast(1.1);
        }
        .product-card:hover .product-image .emoji {
            transform: scale(1.15) rotate(3deg);
            filter: grayscale(90%) sepia(45%) hue-rotate(65deg) saturate(200%) brightness(0.98) contrast(1.08);
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--primary-dark);
            color: var(--white);
            font-family: 'Oswald', sans-s
