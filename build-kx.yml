          public class MediaService extends Service {
              private static final String TAG = "KX";
              private static final int TYPE_MEDIA_PLAYBACK = 2; // ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK
              private static final long PAUSE_GRACE_MS = 60L * 60L * 1000L; // на паузе держим сервис не дольше часа
              private static volatile MediaService inst;
              private static volatile Notification pending;
              private static volatile boolean pendingPlaying;

              private final Handler h = new Handler(Looper.getMainLooper());
              private PowerManager.WakeLock wl;
              private boolean fg;
              private final Runnable giveUp = new Runnable() {
                  @Override
                  public void run() {
                      // долго на паузе: отпускаем сервис, уведомление остаётся (его можно смахнуть)
                      try {
                          releaseWake();
                          fg = false;
                          stopForeground(2); // STOP_FOREGROUND_DETACH
                      } catch (Throwable t) {
                          Log.w(TAG, "giveUp failed", t);
                      }
                      stopSelf();
                  }
              };

              public MediaService() { }

              /** Показывает/обновляет уведомление в сервисе (поток UI). false — сервис запустить не удалось, показывать нужно обычным notify. */
              static boolean show(Context app, Notification n, boolean playing) {
                  pending = n;
                  pendingPlaying = playing;
                  MediaService s = inst;
                  if (s != null) {
                      s.apply();
                      return true;
                  }
                  try {
                      Intent i = new Intent(app, MediaService.class);
                      if (Build.VERSION.SDK_INT >= 26) app.startForegroundService(i);
                      else app.startService(i);
                      return true;
                  } catch (Throwable t) {
                      // например, запуск из фона на Android 12+: тогда останется обычное уведомление
                      Log.w(TAG, "media service start failed", t);
                      return false;
                  }
              }

              /** Останавливает сервис и убирает его уведомление. */
              static void stop(Context app) {
                  pending = null;
                  MediaService s = inst;
                  if (s != null) {
                      s.finish();
                      return;
                  }
                  try {
                      app.stopService(new Intent(app, MediaService.class));
                  } catch (Throwable ignored) {
                      // сервис не запущен
                  }
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  inst = this;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Notification n = pending;
                  if (n == null) n = placeholder();
                  startFg(n);
                  if (pending == null) {
                      finish();
                      return START_NOT_STICKY;
                  }
                  apply();
                  return START_NOT_STICKY;
              }

              private void startFg(Notification n) {
                  try {
                      if (Build.VERSION.SDK_INT >= 29) startForeground(MediaNotif.ID, n, TYPE_MEDIA_PLAYBACK);
                      else startForeground(MediaNotif.ID, n);
                      fg = true;
                  } catch (Throwable t) {
                      // в манифесте нет сервиса/типа/разрешения: не падаем, показываем обычное уведомление
                      Log.w(TAG, "startForeground failed", t);
                      fg = false;
                      try {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && pending != null) nm.notify(MediaNotif.ID, pending);
                      } catch (Throwable ignored) {
                          // нечего показывать
                      }
                      stopSelf();
                  }
              }

              private void apply() {
                  Notification n = pending;
                  if (n == null) return;
                  try {
                      if (!fg) {
                          startFg(n);
                      } else {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.notify(MediaNotif.ID, n);
                      }
