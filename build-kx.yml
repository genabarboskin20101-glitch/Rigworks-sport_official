                          for (int i = 0; i < 300; i++) {
                              long t = ex.getSampleTime();
                              if (t < 0) break;
                              ts.add(t);
                              if (!ex.advance()) break;
                          }
                          Collections.sort(ts);
                          if (ts.size() > 2) {
                              ArrayList<Long> d = new ArrayList<Long>();
                              for (int i = 1; i < ts.size(); i++) d.add(ts.get(i) - ts.get(i - 1));
                              Collections.sort(d);
                              long med = d.get(d.size() / 2);
                              long max = d.get(d.size() - 1);
                              if (med > 0) o.put("fps", Math.round(1e8 / med) / 100.0);
                              o.put("vfr", med > 0 && max > med * 1.6);
                          }
                          ex.unselectTrack(vi);
                      }
                      o.put("hasAudio", ai >= 0);
