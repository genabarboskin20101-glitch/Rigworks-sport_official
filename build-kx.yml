                          o.put("acodec", f.getString(MediaFormat.KEY_MIME));
                          o.put("sampleRate", f.containsKey(MediaFormat.KEY_SAMPLE_RATE) ? f.getInteger(MediaFormat.KEY_SAMPLE_RATE) : 0);
                          o.put("channels", f.containsKey(MediaFormat.KEY_CHANNEL_COUNT) ? f.getInteger(MediaFormat.KEY_CHANNEL_COUNT) : 0);
                          if (dur == 0 && f.containsKey(MediaFormat.KEY_DURATION)) dur = f.getLong(MediaFormat.KEY_DURATION);
                      }
                      o.put("durationUs", dur);
                      return o;
                  } finally {
                      ex.release();
                  }
              }
