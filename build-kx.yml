name: Build KX dex

# Собирает classes2.dex (нативный экспорт для Kadr), версия p0.26-favheart (значок «в избранное» в плитке плеера шторки Android 13+ — белое сердечко вместо системной звезды: билдер подменяет два неиспользуемых PNG шаблона и кладёт маркер assets/kx_fav_icons), p0.25-notif (кнопки уведомления плеера: слева «в избранное» — KExport.mediaFav(bool) и команда window.__kxMedia('fav'), справа ✕ — закрыть приложение целиком: останавливает музыку, убирает уведомление и сервис, закрывает задачу и процесс; кнопка «назад» при играющей музыке сворачивает приложение, а не закрывает его; если Activity всё же уничтожена во время воспроизведения (смахивание из «недавних»), уведомление, сервис и музыка сохраняются; feature media-actions), p0.24-haptic (виброотклик из страницы: KExport.haptic(имя)/hapticCancel() — Vibrator/VibrationEffect (составные примитивы на API 30+, иначе волновая форма с амплитудами), а без разрешения VIBRATE — performHapticFeedback, которому разрешение не нужно; navigator.vibrate в WebView ненадёжен; ещё keepAlive реже «моргает» паузой/возобновлением WebView при сворачивании; feature haptics; разрешение VIBRATE в билдере желательно отметить, но без него вибро всё равно работает), p0.23-noback (механика «назад» удалена: нативного перехвата кнопки «назад» больше нет, поведение системное), p0.22-back (кнопка «назад» телефона: нативный перехват с учётом открытых окон страницы — KExport.setBackDepth(n) + window.__kxBack(); без окон «назад» работает как раньше; feature back-nav), p0.21-fgs (фоновое воспроизведение: музыка и уведомление плеера больше не пропадают при сворачивании — уведомление живёт в foreground-сервисе kx.engine.MediaService (тип mediaPlayback) + WakeLock, WebView не засыпает и его процесс отрисовки не снижает приоритет; билдер сам добавляет сервис и разрешения FOREGROUND_SERVICE / FOREGROUND_SERVICE_MEDIA_PLAYBACK / WAKE_LOCK в манифест; feature media-service), p0.20-art (обложки треков из медиатеки: KExport.audioArt(id) возвращает встроенную обложку или миниатюру MediaStore в base64 JPEG; feature audio-art), p0.19-media (уведомление плеера: MediaSession + MediaStyle с кнопками и обложкой, KExport.mediaSet()/mediaState()/mediaClear(), команды обратно через window.__kxMedia; feature media-notif; на Android 13+ нужна галочка «Уведомления» в билдере), p0.18-edge (края на весь экран: прозрачный статус-бар и панель навигации, KExport.statusInsetTop() — высота статус-бара/выреза сверху в CSS px, feature edge-insets), p0.17-audio (музыка из медиатеки без «доступа ко всем файлам»: KExport.hasAudioAccess()/requestAudioAccess()/listAudio()/readAudioChunk(); нужны разрешения READ_MEDIA_AUDIO / READ_EXTERNAL_STORAGE, feature audio-library), p0.16-share (поделиться файлом из страницы: KExport.shareFileBegin()/shareFileChunk()/shareFileEnd() — файл публикуется через MediaStore и открывается системный список приложений для отправки; feature share-file; ничего нового в AndroidManifest.xml не требуется), p0.15-fsall (чтение произвольных файлов устройства через KExport.listDir()/readFileChunk(), запрос разрешения MANAGE_EXTERNAL_STORAGE/READ_EXTERNAL_STORAGE через KExport.requestAllFilesAccess(); требует отдельно добавить разрешение в AndroidManifest.xml сборщика — см. комментарий к методам в KxBridge.java; feature fs-all), p0.14-shape (фигурные виньетки клипа в шейдере: карта расстояний SDF на текстурном юните 2, анимация по ключам; feature anim-shape), p0.13-animfx (анимация цвета клипа по ключевым кадрам: экспозиция, яркость, контраст, насыщенность, свет, тень, динамика, температура, чёрная точка, тон, резкость, зерно, выцветание, чистота, HSL; feature anim-color), p0.12-anim (ключевые кадры клипов: зум, сдвиг, поворот, эллиптическая виньетка; feature anim-v1), p0.11-fx (цвет и эффекты в нативном экспорте: фильтры, пресеты, яркость/контраст/насыщенность, тоновая коррекция клипа, кривые, резкость, зерно, виньетка клипа, эффекты видео; feature color-fx), p0.10-theme (NavBar: кнопки навигации поверх интерфейса, KExport.navInsetBottom(); тема устройства: KExport.theme() + пуш window.__kxThemeSet при смене светлой/тёмной темы). Запускается сам при коммите этого файла
# и вручную: вкладка Actions → Build KX dex → Run workflow.
# Результат: Releases → kx-latest → classes2.dex (стабильная ссылка), а также артефакт kx-dex.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['.github/workflows/build-kx.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write sources
        shell: bash
        run: |
          mkdir -p src/kx/engine
          cat > src/kx/engine/KxFactory.java <<'KX_EOF'
          package kx.engine;

          import android.app.Activity;
          import android.app.AppComponentFactory;
          import android.app.Application;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.ContentProvider;
          import android.content.Intent;
          import android.util.Log;

          /**
           * Точка входа (хук H1): подменяет android:appComponentFactory шаблона.
           * В шаблоне у CoreComponentFactory методы instantiate* объявлены public final (проверено по
           * classes.dex), поэтому наследоваться от него нельзя. Создаём оригинал рефлексией и делегируем ему всё; после создания
           * Application ставим Boot (lifecycle-callbacks, которые подключают мост KExport к WebView).
           * Работает на API 28+; на 24-27 атрибут игнорируется системой, мост не появится.
           */
          public class KxFactory extends AppComponentFactory {
              private static final String TAG = "KX";
              private final AppComponentFactory core;

              public KxFactory() {
                  AppComponentFactory c = null;
                  try {
                      Class<?> k = Class.forName("androidx.core.app.CoreComponentFactory");
                      java.lang.reflect.Constructor<?> ctor = k.getDeclaredConstructor();
                      ctor.setAccessible(true);
                      c = (AppComponentFactory) ctor.newInstance();
                  } catch (Throwable t) {
                      Log.w(TAG, "CoreComponentFactory unavailable, using platform factory", t);
                  }
                  core = c;
              }

              @Override
              public Application instantiateApplication(ClassLoader cl, String name)
                      throws InstantiationException, IllegalAccessException, ClassNotFoundException {
                  Application app = core != null
                          ? core.instantiateApplication(cl, name)
                          : super.instantiateApplication(cl, name);
                  try {
                      Boot.install(app);
                  } catch (Throwable t) {
                      Log.w(TAG, "Boot.install failed", t);
                  }
                  return app;
              }

              @Override
              public Activity instantiateActivity(ClassLoader cl, String name, Intent intent)
                      throws InstantiationException, IllegalAccessException, ClassNotFoundException {
                  return core != null ? core.instantiateActivity(cl, name, intent)
                          : super.instantiateActivity(cl, name, intent);
              }

              @Override
              public BroadcastReceiver instantiateReceiver(ClassLoader cl, String name, Intent intent)
                      throws InstantiationException, IllegalAccessException, ClassNotFoundException {
                  return core != null ? core.instantiateReceiver(cl, name, intent)
                          : super.instantiateReceiver(cl, name, intent);
              }

              @Override
              public Service instantiateService(ClassLoader cl, String name, Intent intent)
                      throws InstantiationException, IllegalAccessException, ClassNotFoundException {
                  return core != null ? core.instantiateService(cl, name, intent)
                          : super.instantiateService(cl, name, intent);
              }

              @Override
              public ContentProvider instantiateProvider(ClassLoader cl, String name)
                      throws InstantiationException, IllegalAccessException, ClassNotFoundException {
                  return core != null ? core.instantiateProvider(cl, name)
                          : super.instantiateProvider(cl, name);
              }
          }
          KX_EOF
          cat > src/kx/engine/Boot.java <<'KX_EOF'
          package kx.engine;

          import android.app.Activity;
          import android.app.Application;
          import android.content.ComponentCallbacks;
          import android.content.res.Configuration;
          import android.os.Bundle;
          import android.util.Log;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebView;

          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.WeakHashMap;

          /**
           * Находит WebView у WebViewActivity шаблона и регистрирует мост window.KExport.
           * onActivityPostCreated (API 29+) срабатывает сразу после onCreate, до коммита страницы;
           * onActivityStarted/Resumed - запасные точки (API 28 и случай поздней инициализации).
           */
          final class Boot implements Application.ActivityLifecycleCallbacks, ComponentCallbacks {
              private static final String TAG = "KX";
              private static boolean installed;
              private final WeakHashMap<Activity, KxBridge> bridges = new WeakHashMap<Activity, KxBridge>();
              /** Мост уничтоженной Activity, чья страница продолжает играть в фоне (выход из приложения во время воспроизведения). */
              private static volatile KxBridge survivor;

              static void retireSurvivor(Activity now) {
                  KxBridge old = survivor;
                  if (old == null || old.act == now) return;
                  survivor = null;
                  try {
                      old.retire();
                  } catch (Throwable t) {
                      Log.w(TAG, "retire failed", t);
                  }
              }

              static void forgetSurvivor() { survivor = null; }

              static synchronized void install(Application app) {
                  if (installed) return;
                  installed = true;
                  Boot b = new Boot();
                  app.registerActivityLifecycleCallbacks(b);
                  app.registerComponentCallbacks(b); // смена темы устройства приходит сюда (onConfigurationChanged)
              }

              private void attach(Activity a) {
                  try {
                      // только основная Activity оболочки (у AdMob и др. свои Activity со своими WebView)
                      if (!"WebViewActivity".equals(a.getClass().getSimpleName())) return;
                      NavBar.apply(a); // кнопки навигации (если включено в билдере); сам ловит свои ошибки
                      KxBridge known = bridges.get(a);
                      if (known != null) {
                          known.ensureHook(); // оболочка могла заменить WebChromeClient
                          return;
                      }
                      WebView wv = findWebView(a);
                      if (wv == null) return;
                      retireSurvivor(a); // прежняя страница, игравшая в фоне после выхода, уступает место новой
                      KxBridge br = new KxBridge(a, wv);
                      wv.addJavascriptInterface(br, "KExport");
                      bridges.put(a, br);
                      br.ensureHook();
                      br.priorityPolicy();
                      br.backGuard();
                      Log.i(TAG, "KExport attached to " + a.getClass().getName());
                      // объект виден только документам, загруженным ПОСЛЕ регистрации: если страница уже загружена
                      // (WebView создан лениво, регистрация поздняя) - перезагружаем её один раз
                      if (wv.getUrl() != null && wv.getProgress() >= 100) {
                          Log.i(TAG, "page already loaded, reloading once");
                          wv.reload();
                      }
                  } catch (Throwable t) {
                      Log.w(TAG, "attach failed", t);
                  }
              }

              private static WebView findWebView(Activity a) {
                  try {
                      Method m = a.getClass().getMethod("getWebView");
                      Object o = m.invoke(a);
                      if (o instanceof WebView) return (WebView) o;
                  } catch (Throwable ignored) {
                      // lateinit ещё не готов или метод переименован - идём обходом View
                  }
                  View root = a.getWindow() != null ? a.getWindow().peekDecorView() : null;
                  return root == null ? null : walk(root);
              }

              private static WebView walk(View v) {
                  if (v instanceof WebView) return (WebView) v;
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) {
                          WebView w = walk(g.getChildAt(i));
                          if (w != null) return w;
                      }
                  }
                  return null;
              }

              public void onActivityCreated(Activity a, Bundle b) { }

              public void onActivityPostCreated(Activity a, Bundle b) { attach(a); }

              public void onActivityStarted(Activity a) { attach(a); }

              public void onActivityResumed(Activity a) {
                  attach(a);
                  KxBridge br = bridges.get(a);
                  if (br != null) br.pushTheme(null); // тема могла смениться, пока приложение было в фоне
              }

              /** Светлая/тёмная тема устройства (и любая другая смена конфигурации): сообщаем странице. */
              public void onConfigurationChanged(Configuration c) {
                  try {
                      for (KxBridge br : new ArrayList<KxBridge>(bridges.values())) br.pushTheme(c);
                  } catch (Throwable t) {
                      Log.w(TAG, "theme push failed", t);
                  }
              }

              public void onLowMemory() { }

              public void onActivityPaused(Activity a) {
                  KxBridge br = bridges.get(a);
                  if (br != null) br.keepAlive(); // музыка играет — страницу не усыпляем
              }

              public void onActivityStopped(Activity a) {
                  KxBridge br = bridges.get(a);
                  if (br != null) br.keepAlive();
              }

              public void onActivitySaveInstanceState(Activity a, Bundle b) { }

              public void onActivityDestroyed(Activity a) {
                  KxBridge br = bridges.remove(a);
                  if (br == null) return;
                  if (br.outlivesActivity(a)) {
                      // выход из приложения во время воспроизведения: музыку, сервис и уведомление не трогаем
                      survivor = br;
                      br.keepAliveDetached();
                  } else {
                      br.shutdown();
                  }
              }
          }
          KX_EOF
          cat > src/kx/engine/NavBar.java <<'KX_EOF'
          package kx.engine;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.View;
          import android.view.ViewTreeObserver;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.WeakHashMap;

          /**
           * Держит системные кнопки навигации видимыми (галочка «Всегда показывать кнопки навигации» в билдере).
           * Оболочка шаблона этот ключ config.json не читает, а на ряде прошивок тема/окно «на весь экран»
           * прячет панель. Поэтому здесь явно запрашиваем показ панели при создании окна, при возврате в
           * приложение, при получении фокуса (после выхода из полноэкранного превью) и пока система
           * пытается её скрыть. Панель делаем прозрачной: интерфейс страницы остаётся на весь экран, кнопки
           * лежат поверх него. Высоту панели (CSS px) отдаём странице через KExport.navInsetBottom().
           * Включается только флагом alwaysShowNavButtons в assets/www/config.json.
           */
          final class NavBar {
              private static final String TAG = "KX";
              private static final WeakHashMap<Activity, Boolean> STATE = new WeakHashMap<Activity, Boolean>();
              private static final Handler H = new Handler(Looper.getMainLooper());
              private static volatile int navBottomCss = 0;
              private static volatile int statusTopCss = 0;

              /** Высота статус-бара/выреза сверху в CSS px (только если он сейчас виден), иначе 0. */
              static int statusTopCss() { return statusTopCss; }

              /** Высота панели навигации снизу в CSS px (0, если панели нет или функция выключена). */
              static int navBottomCss() { return navBottomCss; }

              private NavBar() { }

              static void apply(final Activity a) {
                  try {
                      Boolean on;
                      synchronized (STATE) { on = STATE.get(a); }
                      if (on == null) {
                          on = Boolean.valueOf(readFlag(a));
                          synchronized (STATE) { STATE.put(a, on); }
                          if (on.booleanValue()) install(a);
                      }
                      if (on.booleanValue()) schedule(a);
                  } catch (Throwable t) {
                      Log.w(TAG, "NavBar.apply failed", t);
                  }
              }

              private static boolean readFlag(Activity a) {
                  InputStream in = null;
                  try {
                      in = a.getAssets().open("www/config.json");
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] b = new byte[4096];
                      int n;
                      while ((n = in.read(b)) > 0) bo.write(b, 0, n);
                      JSONObject j = new JSONObject(new String(bo.toByteArray(), "UTF-8"));
                      return j.optBoolean("alwaysShowNavButtons", false);
                  } catch (Throwable t) {
                      return false;
                  } finally {
                      if (in != null) {
                          try { in.close(); } catch (Throwable ignored) { }
                      }
                  }
              }

              @SuppressWarnings("deprecation")
              private static void install(final Activity a) {
                  Window w = a.getWindow();
                  if (w == null) return;
                  View d = w.getDecorView();
                  // фокус вернулся (выход из полноэкранного превью, шторка, переключение приложений)
                  d.getViewTreeObserver().addOnWindowFocusChangeListener(new ViewTreeObserver.OnWindowFocusChangeListener() {
                      @Override
                      public void onWindowFocusChanged(boolean hasFocus) {
                          if (hasFocus) schedule(a);
                      }
                  });
                  // Android 10 и ниже: система сообщает, что панель скрыли, — показываем снова
                  if (Build.VERSION.SDK_INT < 30) {
                      d.setOnSystemUiVisibilityChangeListener(new View.OnSystemUiVisibilityChangeListener() {
                          @Override
                          public void onSystemUiVisibilityChange(int visibility) {
                              if ((visibility & View.SYSTEM_UI_FLAG_HIDE_NAVIGATION) != 0) schedule(a);
                          }
                      });
                  }
              }

              private static void schedule(final Activity a) {
                  show(a);
                  Runnable r = new Runnable() {
                      @Override
                      public void run() { show(a); }
                  };
                  H.postDelayed(r, 250);
                  H.postDelayed(r, 1000);
                  H.postDelayed(r, 2500);
              }

              @SuppressWarnings("deprecation")
              private static void show(Activity a) {
                  try {
                      if (a.isFinishing() || a.isDestroyed()) return;
                      Window w = a.getWindow();
                      if (w == null) return;
                      if (Build.VERSION.SDK_INT >= 30) {
                          WindowInsetsController c = w.getInsetsController();
                          if (c != null) {
                              c.show(WindowInsets.Type.navigationBars());
                              // светлые значки (страница тёмная)
                              c.setSystemBarsAppearance(0, WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS);
                          }
                      } else {
                          View d = w.getDecorView();
                          int f = d.getSystemUiVisibility();
                          int n = f & ~(View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                          if (Build.VERSION.SDK_INT >= 26) n &= ~View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                          if (n != f) d.setSystemUiVisibility(n);
                      }
                      // прозрачная панель без «затемняющей подложки» системы: интерфейс виден под кнопками
                      if (Build.VERSION.SDK_INT < 35) w.setNavigationBarColor(Color.TRANSPARENT);
                      if (Build.VERSION.SDK_INT >= 29) w.setNavigationBarContrastEnforced(false);
                      // то же для статус-бара: интерфейс продолжается под ним, значки остаются поверх
                      if (Build.VERSION.SDK_INT < 35) w.setStatusBarColor(Color.TRANSPARENT);
                      measure(a, w);
                  } catch (Throwable t) {
                      Log.w(TAG, "NavBar.show failed", t);
                  }
              }

              @SuppressWarnings("deprecation")
              private static void measure(Activity a, Window w) {
                  try {
                      WindowInsets wi = w.getDecorView().getRootWindowInsets();
                      if (wi == null) return;
                      int px;
                      if (Build.VERSION.SDK_INT >= 30) {
                          px = wi.getInsetsIgnoringVisibility(WindowInsets.Type.navigationBars()).bottom;
                      } else {
                          px = wi.getStableInsetBottom();
                      }
                      float den = a.getResources().getDisplayMetrics().density;
                      if (den <= 0f) den = 1f;
                      navBottomCss = Math.max(0, Math.round(px / den));
                      int top;
                      if (Build.VERSION.SDK_INT >= 30) {
                          top = wi.getInsets(WindowInsets.Type.statusBars() | WindowInsets.Type.displayCutout()).top;
                      } else {
                          top = wi.getSystemWindowInsetTop();
                      }
                      statusTopCss = Math.max(0, Math.round(top / den));
                  } catch (Throwable t) {
                      Log.w(TAG, "NavBar.measure failed", t);
                  }
              }
          }
          KX_EOF
          cat > src/kx/engine/MediaNotif.java <<'KX_EOF'
          package kx.engine;

          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.drawable.Icon;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.util.Base64;
          import android.util.Log;

          /**
           * Делает приложение «аудиоплеером» для системы: MediaSession (экран блокировки, плитка медиа в шторке,
           * кнопки гарнитур и Bluetooth) и уведомление в стиле MediaStyle с обложкой и кнопками «назад / пауза / вперёд».
           * Страница передаёт данные через KExport.mediaSet()/mediaState()/mediaClear(), а команды из системы
           * приходят обратно вызовом window.__kxMedia('play'|'pause'|'next'|'prev'|'seek', позиция_мс).
           * Для показа уведомления на Android 13+ в билдере нужна галочка «Уведомления» (POST_NOTIFICATIONS).
           */
          final class MediaNotif {
              interface Sink { void action(String name, long posMs); }

              private static final String TAG = "KX";
              static final String CHANNEL = "kx_media";
              private static final String PFX = "kx.engine.MEDIA.";
              static final int ID = 7301;
              private static final int REQ_PERM = 7302;

              private final Activity act;
              private final Sink sink;
              private final Handler main = new Handler(Looper.getMainLooper());
              private MediaSession session;
              private BroadcastReceiver receiver;
              private Icon iPrev, iNext, iPlay, iPause, iSmall, iFavOn, iFavOff, iClose;
