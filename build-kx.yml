          /**
           * Foreground-сервис воспроизведения (тип mediaPlayback). Пока он работает, система считает приложение
           * «играющим плеером» и не убивает ни процесс приложения, ни процесс отрисовки WebView, когда приложение свёрнуто.
           * Без него уведомление с кнопками жило только до тех пор, пока система не выгружала процесс в фоне:
