               * abc_ic_commit_search_api_mtrl_alpha — контур (не в избранном), abc_scrubber_control_off_mtrl_alpha — закрашенное (в избранном).
               * Если маркера нет (старый билдер) — прежние системные звёзды, чтобы не показать случайный чужой значок.
               */
              private int favRes(boolean on) {
                  try {
                      Context c = act.getApplicationContext();
                      if (favIcons == null) {
                          boolean ok = false;
                          try {
                              c.getAssets().open("kx_fav_icons").close();
                              ok = true;
                          } catch (Throwable ignored) {
                              // маркера нет
                          }
                          favIcons = ok;
                      }
                      if (favIcons) {
                          int id = c.getResources().getIdentifier(on ? "abc_scrubber_control_off_mtrl_alpha" : "abc_ic_commit_search_api_mtrl_alpha",
                                  "drawable", c.getPackageName());
                          if (id != 0) return id;
                      }
                  } catch (Throwable t) {
                      Log.w(TAG, "favRes failed", t);
                  }
                  return on ? android.R.drawable.btn_star_big_on : android.R.drawable.btn_star_big_off;
              }

              private PendingIntent pi(String name) {
                  Context c = act.getApplicationContext();
                  Intent i = new Intent(PFX + name).setPackage(c.getPackageName());
                  int fl = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0);
                  return PendingIntent.getBroadcast(c, name.hashCode() & 0xffff, i, fl);
              }

              private void notifyShade() {
                  try {
                      Context c = act.getApplicationContext();
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      if (Build.VERSION.SDK_INT >= 33 && !askedPerm
                              && act.checkSelfPermission("android.permission.POST_NOTIFICATIONS") != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          askedPerm = true;
                          act.requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, REQ_PERM);
                      }
                      Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, CHANNEL) : new Notification.Builder(c);
                      b.setSmallIcon(iSmall)
                              .setContentTitle(title)
                              .setContentText(artist)
                              .setOngoing(playing)
                              .setOnlyAlertOnce(true)
                              .setShowWhen(false)
                              .setVisibility(Notification.VISIBILITY_PUBLIC)
                              .setCategory(Notification.CATEGORY_TRANSPORT);
                      if (album.length() > 0) b.setSubText(album);
                      if (art != null) b.setLargeIcon(art);
                      Intent launch = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK);
                          int fl = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0);
                          b.setContentIntent(PendingIntent.getActivity(c, 0, launch, fl));
                      }
                      b.addAction(new Notification.Action.Builder(fav ? iFavOn : iFavOff, fav ? "Убрать из избранного" : "В избранное", pi("fav")).build());
                      b.addAction(new Notification.Action.Builder(iPrev, "Назад", pi("prev")).build());
                      b.addAction(new Notification.Action.Builder(playing ? iPause : iPlay, playing ? "Пауза" : "Играть", pi("toggle")).build());
                      b.addAction(new Notification.Action.Builder(iNext, "Вперёд", pi("next")).build());
                      b.addAction(new Notification.Action.Builder(iClose, "Закрыть", pi("close")).build());
                      b.setStyle(new Notification.MediaStyle()
                              .setMediaSession(session.getSessionToken())
                              .setShowActionsInCompactView(1, 2, 3));
                      Notification n = b.build();
                      // уведомление живёт в foreground-сервисе: пока он работает, система не выгружает приложение в фоне
                      if (!(started && MediaService.show(c, n, playing))) nm.notify(ID, n);
                  } catch (Throwable t) {
                      Log.w(TAG, "media notification failed", t);
                  }
              }

              private static void heart(Path path) {
                  path.moveTo(48f, 80f);
                  path.cubicTo(10f, 54f, 14f, 20f, 36f, 20f);
                  path.cubicTo(43f, 20f, 47f, 24f, 48f, 29f);
                  path.cubicTo(49f, 24f, 53f, 20f, 60f, 20f);
                  path.cubicTo(82f, 20f, 86f, 54f, 48f, 80f);
                  path.close();
              }

              /** Простые белые значки, нарисованные кодом (ресурсов в оболочке нет). */
              private static Icon icon(int kind) {
                  int s = 96;
                  Bitmap b = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(b);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  p.setColor(0xFFFFFFFF);
                  Path path = new Path();
                  switch (kind) {
                      case 0: // назад
                          c.drawRect(22f, 24f, 32f, 72f, p);
                          path.moveTo(74f, 24f);
                          path.lineTo(74f, 72f);
                          path.lineTo(36f, 48f);
                          path.close();
                          c.drawPath(path, p);
                          break;
                      case 1: // вперёд
                          c.drawRect(64f, 24f, 74f, 72f, p);
                          path.moveTo(22f, 24f);
                          path.lineTo(22f, 72f);
                          path.lineTo(60f, 48f);
                          path.close();
                          c.drawPath(path, p);
                          break;
                      case 2: // играть
                          path.moveTo(30f, 18f);
                          path.lineTo(30f, 78f);
                          path.lineTo(80f, 48f);
                          path.close();
                          c.drawPath(path, p);
                          break;
                      case 3: // пауза
                          c.drawRect(26f, 20f, 44f, 76f, p);
                          c.drawRect(52f, 20f, 70f, 76f, p);
                          break;
                      case 5: // сердце (контур): трек не в избранном
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(7f);
                          p.setStrokeJoin(Paint.Join.ROUND);
                          heart(path);
                          c.drawPath(path, p);
                          break;
                      case 6: // сердце (залито): трек в избранном
                          heart(path);
                          c.drawPath(path, p);
                          break;
                      case 7: // крестик
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(9f);
                          p.setStrokeCap(Paint.Cap.ROUND);
                          c.drawLine(28f, 28f, 68f, 68f, p);
                          c.drawLine(68f, 28f, 28f, 68f, p);
                          break;
                      default: // нота (маленький значок уведомления)
                          c.drawCircle(34f, 70f, 15f, p);
                          c.drawRect(45f, 16f, 54f, 70f, p);
                          path.moveTo(54f, 16f);
                          path.lineTo(80f, 28f);
                          path.lineTo(80f, 44f);
                          path.lineTo(54f, 32f);
                          path.close();
                          c.drawPath(path, p);
                          break;
                  }
                  return Icon.createWithBitmap(b);
              }
          }
