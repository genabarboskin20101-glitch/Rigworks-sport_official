                          } catch (Throwable ignored) {
                              // WebView уже уничтожен
                          }
                      }
                  });
              }

              // ---------- вспомогательное ----------

              static JSONObject o(Object... kv) {
                  JSONObject j = new JSONObject();
                  try {
                      for (int i = 0; i + 1 < kv.length; i += 2) j.put((String) kv[i], kv[i + 1]);
                  } catch (Exception ignored) {
                      // значения собираются из своих же типов
                  }
                  return j;
              }

              static String err(String msg) {
                  return o("ok", false, "error", msg).toString();
              }

              static String err(Throwable t) {
                  Log.w(TAG, "bridge error", t);
                  return err(t.getClass().getSimpleName() + ": " + t.getMessage());
              }

              private static boolean validId(String id) {
                  return id != null && id.matches("[A-Za-z0-9_\\-]{1,64}");
              }

              File fileFor(String id) {
                  if (!validId(id)) return null;
                  File f = new File(dir, id + ".bin");
                  return (f.exists() && new File(dir, id + ".ok").exists()) ? f : null;
              }

              Src srcFor(String id) {
                  if (!validId(id)) return null;
                  Uri u = uriSrc.get(id);
                  if (u != null) return new Src(u);
                  File f = fileFor(id);
                  return f == null ? null : new Src(f);
              }

              /** Подменяет WebChromeClient оболочки обёрткой FileHook (API 26+); вызывается из потока UI. */
              void ensureHook() {
                  try {
                      if (Build.VERSION.SDK_INT < 26) return;
                      WebChromeClient cur = web.getWebChromeClient();
                      if (cur == null) return;
                      if (!(cur instanceof FileHook)) web.setWebChromeClient(new FileHook(cur, this));
                      hooked = true;
                  } catch (Throwable t) {
                      Log.w(TAG, "ensureHook failed", t);
                  }
              }

              /** Запоминает URI, которые пользователь выбрал в системном диалоге (вызывается из FileHook). */
              void recordPicked(Uri[] uris) {
                  if (uris == null) return;
                  ContentResolver cr = act.getContentResolver();
                  for (Uri u : uris) {
                      if (u == null) continue;
                      Picked p = new Picked();
                      p.uri = u;
                      Cursor c = null;
                      try {
                          c = cr.query(u, new String[] {OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE}, null, null, null);
                          if (c != null && c.moveToFirst()) {
                              int ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                              int si = c.getColumnIndex(OpenableColumns.SIZE);
                              if (ni >= 0 && !c.isNull(ni)) p.name = c.getString(ni);
                              if (si >= 0 && !c.isNull(si)) p.size = c.getLong(si);
                          }
                      } catch (Throwable t) {
                          Log.w(TAG, "query picked failed", t);
                      } finally {
                          if (c != null) c.close();
                      }
                      if (p.size < 0) {
                          try {
                              AssetFileDescriptor f = cr.openAssetFileDescriptor(u, "r");
                              if (f != null) {
                                  p.size = f.getLength();
                                  f.close();
                              }
                          } catch (Throwable ignored) {
                              // размер определится позже или совпадение не найдётся
                          }
                      }
                      synchronized (this) {
                          picked.add(p);
                          while (picked.size() > 300) picked.remove(0);
                      }
                  }
              }

              private static String sha1(String s) throws Exception {
                  byte[] d = MessageDigest.getInstance("SHA-1").digest(s.getBytes("UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  for (byte b : d) sb.append(String.format("%02x", b & 0xff));
                  return sb.toString();
              }

              private long free() {
                  return new StatFs(dir.getPath()).getAvailableBytes();
              }

              private void trimCache(long need) {
                  File[] fs = dir.listFiles();
                  if (fs == null) return;
                  ArrayList<File> bins = new ArrayList<File>();
                  long total = 0;
                  for (File f : fs) {
                      if (f.getName().endsWith(".bin")) {
                          bins.add(f);
                          total += f.length();
                      }
                  }
                  Collections.sort(bins, new java.util.Comparator<File>() {
                      public int compare(File a, File b) {
                          return Long.compare(a.lastModified(), b.lastModified());
                      }
                  });
                  for (File f : bins) {
                      if (total <= CACHE_LIMIT && free() >= need) break;
                      total -= f.length();
                      String base = f.getName().substring(0, f.getName().length() - 4);
                      f.delete();
                      new File(dir, base + ".ok").delete();
                  }
              }

              void emit(JSONObject ev) {
                  String s = ev.toString()
                          .replace(String.valueOf((char) 0x2028), "\\u2028")
                          .replace(String.valueOf((char) 0x2029), "\\u2029");
                  final String js = "window.__kx&&window.__kx.onEvent&&window.__kx.onEvent(" + s + ")";
                  act.runOnUiThread(new Runnable() {
                      public void run() {
                          try {
                              web.evaluateJavascript(js, null);
                          } catch (Throwable t) {
                              Log.w(TAG, "emit failed", t);
                          }
                      }
                  });
              }

              void keepScreenOn(final boolean on) {
                  act.runOnUiThread(new Runnable() {
                      public void run() {
                          try {
                              if (on) act.getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              else act.getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          } catch (Throwable ignored) {
                              // окно уже закрыто
                          }
                      }
                  });
              }

              void jobDone(String id) {
                  jobs.remove(id);
              }

              void registerUri(String u) {
                  uris.add(u);
              }

              private MediaNotif media;

              private synchronized MediaNotif media() {
                  if (media == null) {
                      media = new MediaNotif(act, new MediaNotif.Sink() {
                          @Override
                          public void action(String name, long posMs) {
                              if ("close".equals(name)) { // ✕ в уведомлении: закрываем приложение целиком (команду страница не получает)
                                  closeApp();
                                  return;
                              }
                              final String js = "window.__kxMedia&&window.__kxMedia('" + name + "'," + posMs + ")";
                              act.runOnUiThread(new Runnable() {
                                  public void run() {
                                      try {
                                          web.evaluateJavascript(js, null);
                                      } catch (Throwable ignored) {
                                          // WebView уже уничтожен
                                      }
                                  }
                              });
                          }
                      });
                  }
                  return media;
              }

              /** Процесс отрисовки WebView не должен терять приоритет, когда приложение свёрнуто (иначе система его убивает и страница замирает). */
              void priorityPolicy() {
                  try {
                      if (Build.VERSION.SDK_INT >= 26) web.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false);
                  } catch (Throwable t) {
                      Log.w(TAG, "priorityPolicy failed", t);
                  }
              }

              /** Пока играет музыка, не даём оболочке «усыпить» WebView при сворачивании (onPause/pauseTimers): страница должна продолжать работать. */
              void keepAlive() {
                  if (!mediaPlaying) return;
                  Runnable r = new Runnable() {
                      public void run() {
                          try {
                              if (!mediaPlaying) return;
                              web.onResume();
                              web.resumeTimers();
                          } catch (Throwable ignored) {
                              // WebView уже уничтожен
                          }
                      }
                  };
                  // оболочка вызывает onPause() уже после нашего колбэка — возобновляем сразу же и повторяем, пока она не успокоится
                  web.post(r);
                  web.postDelayed(r, 60);
                  web.postDelayed(r, 250);
                  web.postDelayed(r, 1200);
              }

              /** Новый трек для уведомления плеера: обложка - JPEG в base64 (может быть пустой строкой). */
              @JavascriptInterface
              public void mediaSet(String title, String artist, String album, double durationMs, String artB64) {
                  try {
                      media().set(title, artist, album, (long) durationMs, artB64);
                  } catch (Throwable t) {
                      Log.w(TAG, "mediaSet failed", t);
                  }
              }

              /** Играет/пауза и позиция в мс. */
              @JavascriptInterface
              public void mediaState(boolean playing, double positionMs) {
                  try {
                      mediaPlaying = playing;
                      media().state(playing, (long) positionMs);
                      refreshBackGuard();
                  } catch (Throwable t) {
                      Log.w(TAG, "mediaState failed", t);
                  }
              }

              /** Трек в избранном или нет: сердце в уведомлении. Страница шлёт при смене трека и при каждом переключении избранного. */
              @JavascriptInterface
              public void mediaFav(boolean fav) {
                  try {
                      media().fav(fav);
                  } catch (Throwable t) {
                      Log.w(TAG, "mediaFav failed", t);
                  }
              }

              // ---------- выход из приложения во время воспроизведения (p0.25-notif) ----------
              // 1) «назад» при играющей музыке сворачивает приложение (moveTaskToBack) — страница, музыка и уведомление живут дальше;
              //    Android 13+ (в манифесте включён OnBackInvokedCallback): обработчик OnBackInvokedDispatcher, пока музыка играет;
              //    Android 7-12: перехват KEYCODE_BACK в Window.Callback.
              // 2) если Activity всё же уничтожена при играющей музыке (смахивание из «недавних»), Boot оставляет этот мост жить:
              //    сервис и уведомление не снимаются, страница продолжает играть в отсоединённом WebView.
              // 3) ✕ в уведомлении (closeApp) закрывает всё: пауза и сохранение в странице, снятие уведомления и сервиса, закрытие задачи, завершение процесса.
              private final android.os.Handler uiH = new android.os.Handler(android.os.Looper.getMainLooper());
              private volatile boolean closing;
              private Object backCb;
              private boolean backCbOn;

              boolean outlivesActivity(Activity a) {
                  try {
                      return mediaPlaying && !closing && !a.isChangingConfigurations();
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Activity уничтожена, а музыка играет: не даём WebView уснуть (view.post у отсоединённого WebView не сработает — идём через свой Handler). */
              void keepAliveDetached() {
                  final Runnable r = new Runnable() {
                      public void run() {
                          try {
                              if (!mediaPlaying) return;
                              web.onResume();
                              web.resumeTimers();
                          } catch (Throwable ignored) {
                              // WebView уже уничтожен
                          }
                      }
                  };
                  r.run();
                  uiH.postDelayed(r, 120);
                  uiH.postDelayed(r, 600);
                  uiH.postDelayed(r, 2000);
              }

              /** Запущена новая Activity, а страница прежней ещё играет в фоне: останавливаем и сохраняем её, снимаем её уведомление — новая страница создаст своё. */
              void retire() {
                  mediaPlaying = false;
                  closing = true;
                  try {
                      web.evaluateJavascript("window.__kxMedia&&window.__kxMedia('close',0)", null);
                  } catch (Throwable ignored) {
                      // WebView уже уничтожен
                  }
                  shutdown();
                  uiH.postDelayed(new Runnable() {
                      public void run() {
                          try {
                              web.destroy();
                          } catch (Throwable ignored) {
                              // уже уничтожен
                          }
                      }
                  }, 500);
              }

              /** ✕ в уведомлении: закрыть приложение целиком. */
              void closeApp() {
                  closing = true;
                  mediaPlaying = false;
                  uiH.post(new Runnable() {
                      public void run() {
                          try {
                              web.evaluateJavascript("window.__kxMedia&&window.__kxMedia('close',0)", null); // пауза + сохранение позиции
                          } catch (Throwable ignored) {
                              // WebView уже уничтожен
                          }
                          uiH.postDelayed(new Runnable() {
                              public void run() {
                                  try {
                                      shutdown();
                                  } catch (Throwable ignored) {
                                      // ресурсы уже освобождены
                                  }
                                  Boot.forgetSurvivor();
                                  try {
                                      act.finishAndRemoveTask();
                                  } catch (Throwable t) {
                                      try {
                                          act.finishAffinity();
                                      } catch (Throwable ignored) {
                                          // Activity уже закрыта
                                      }
                                  }
                                  uiH.postDelayed(new Runnable() {
                                      public void run() {
                                          android.os.Process.killProcess(android.os.Process.myPid());
                                      }
                                  }, 300);
                              }
                          }, 250);
                      }
                  });
              }

              /** «Назад» при играющей музыке: true — событие поглощено (приложение свёрнуто). Если у WebView есть история — отдаём оболочке (она сделает goBack). */
              private boolean backToBackground(boolean doIt) {
                  if (!mediaPlaying || closing) return false;
                  try {
                      if (web.canGoBack()) return false;
                  } catch (Throwable ignored) {
                      // WebView недоступен
                  }
                  if (doIt) {
                      try {
                          act.moveTaskToBack(true);
                      } catch (Throwable t) {
                          Log.w(TAG, "moveTaskToBack failed", t);
                      }
                  }
                  return true;
              }

              /** Android 7-12: перехват кнопки «назад» в Window.Callback (на 13+ «назад» приходит иначе — см. refreshBackGuard). Вызывается один раз при подключении моста. */
              void backGuard() {
                  try {
                      if (Build.VERSION.SDK_INT >= 33) return;
                      final android.view.Window w = act.getWindow();
                      final android.view.Window.Callback orig = w.getCallback();
                      if (orig == null) return;
                      w.setCallback((android.view.Window.Callback) java.lang.reflect.Proxy.newProxyInstance(
                              KxBridge.class.getClassLoader(), new Class<?>[] { android.view.Window.Callback.class },
                              new java.lang.reflect.InvocationHandler() {
                                  public Object invoke(Object proxy, java.lang.reflect.Method m, Object[] args) throws Throwable {
                                      try {
                                          if (args != null && args.length == 1 && "dispatchKeyEvent".equals(m.getName())) {
                                              android.view.KeyEvent e = (android.view.KeyEvent) args[0];
                                              if (e.getKeyCode() == android.view.KeyEvent.KEYCODE_BACK
                                                      && backToBackground(e.getAction() == android.view.KeyEvent.ACTION_UP && !e.isCanceled())) {
                                                  return Boolean.TRUE;
                                              }
                                          }
                                          return m.invoke(orig, args);
                                      } catch (java.lang.reflect.InvocationTargetException ite) {
                                          throw ite.getCause() != null ? ite.getCause() : ite;
                                      }
                                  }
                              }));
                  } catch (Throwable t) {
                      Log.w(TAG, "backGuard failed", t);
                  }
              }

              /** Android 13+: пока музыка играет, держим свой обработчик «назад» поверх обработчика оболочки; на паузе снимаем — «назад» работает как раньше. */
              void refreshBackGuard() {
                  uiH.post(new Runnable() {
                      public void run() {
                          try {
                              if (Build.VERSION.SDK_INT < 33) return;
                              android.window.OnBackInvokedDispatcher d = act.getOnBackInvokedDispatcher();
                              boolean want = mediaPlaying && !closing;
                              if (want && !backCbOn) {
                                  android.window.OnBackInvokedCallback cb = new android.window.OnBackInvokedCallback() {
                                      public void onBackInvoked() {
                                          try {
                                              if (web.canGoBack()) {
                                                  web.goBack();
                                                  return;
                                              }
                                          } catch (Throwable ignored) {
                                              // WebView недоступен
                                          }
                                          try {
                                              act.moveTaskToBack(true);
                                          } catch (Throwable t) {
                                              Log.w(TAG, "moveTaskToBack failed", t);
                                          }
                                      }
                                  };
                                  d.registerOnBackInvokedCallback(android.window.OnBackInvokedDispatcher.PRIORITY_OVERLAY, cb);
                                  backCb = cb;
                                  backCbOn = true;
                              } else if (!want && backCbOn) {
                                  d.unregisterOnBackInvokedCallback((android.window.OnBackInvokedCallback) backCb);
                                  backCb = null;
                                  backCbOn = false;
                              }
                          } catch (Throwable t) {
                              Log.w(TAG, "refreshBackGuard failed", t);
                          }
                      }
                  });
              }

              /** Убрать уведомление плеера. */
              @JavascriptInterface
              public void mediaClear() {
                  try {
                      mediaPlaying = false;
                      media().clear();
                      refreshBackGuard();
                  } catch (Throwable t) {
                      Log.w(TAG, "mediaClear failed", t);
                  }
              }

              void shutdown() {
                  if (media != null) media.release();
                  for (Exporter e : jobs.values()) e.cancel();
                  synchronized (this) {
                      for (RandomAccessFile r : open.values()) {
                          try {
                              r.close();
                          } catch (Throwable ignored) {
                              // уже закрыт
                          }
                      }
                      open.clear();
                  }
              }

              // ---------- методы для JS ----------

              @JavascriptInterface
              public String ping() {
                  return "pong";
              }

              @JavascriptInterface
              public String caps() {
                  try {
                      JSONObject o = Probe.caps();
                      o.put("zeroCopy", hooked);
                      o.put("allFilesAccess", hasAllFilesAccessInternal());
                      return o.toString();
