              @JavascriptInterface
              public String readAudioChunk(String id, long offset) {
                  android.os.ParcelFileDescriptor pfd = null;
                  try {
                      if (!audioGranted()) return err("no_permission");
                      long mid = Long.parseLong(id);
                      Uri u = android.content.ContentUris.withAppendedId(android.provider.MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, mid);
                      pfd = act.getContentResolver().openFileDescriptor(u, "r");
                      if (pfd == null) return err("open_failed");
                      java.io.FileInputStream in = new java.io.FileInputStream(pfd.getFileDescriptor());
                      java.nio.channels.FileChannel ch = in.getChannel();
                      long total = ch.size();
                      if (offset < 0 || offset > total) return err("bad_offset");
                      long want = Math.min(FS_READ_CHUNK, total - offset);
                      byte[] buf = new byte[(int) want];
                      ch.position(offset);
                      int got = 0;
                      while (got < buf.length) {
                          int n = in.read(buf, got, buf.length - got);
                          if (n < 0) break;
                          got += n;
                      }
                      if (got != buf.length) return err("short_read");
                      String b64 = Base64.encodeToString(buf, Base64.NO_WRAP);
                      return o("ok", true, "data", b64, "size", total, "eof", offset + want >= total).toString();
