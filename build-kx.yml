                      }
                  } catch (Throwable t) {
                      // нет разрешения WAKE_LOCK — музыка играет и без него
                      Log.w(TAG, "wake lock failed", t);
                  }
              }

              private void releaseWake() {
                  try {
                      if (wl != null && wl.isHeld()) wl.release();
                  } catch (Throwable ignored) {
                      // уже отпущен
                  }
              }

              private Notification placeholder() {
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, MediaNotif.CHANNEL) : new Notification.Builder(this);
                  return b.setSmallIcon(android.R.drawable.ic_media_play).setContentTitle("Воспроизведение").setOngoing(true).build();
              }

              private void finish() {
                  h.removeCallbacksAndMessages(null);
                  releaseWake();
                  try {
                      stopForeground(true);
                  } catch (Throwable ignored) {
                      // не был в foreground
                  }
                  fg = false;
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  h.removeCallbacksAndMessages(null);
                  releaseWake();
                  if (inst == this) inst = null;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
