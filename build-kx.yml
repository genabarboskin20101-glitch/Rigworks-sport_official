                          o.put("vcodec", f.getString(MediaFormat.KEY_MIME));
                          o.put("w", f.getInteger(MediaFormat.KEY_WIDTH));
                          o.put("h", f.getInteger(MediaFormat.KEY_HEIGHT));
                          o.put("rotation", f.containsKey(MediaFormat.KEY_ROTATION) ? f.getInteger(MediaFormat.KEY_ROTATION) : 0);
                          if (f.containsKey(MediaFormat.KEY_DURATION)) dur = f.getLong(MediaFormat.KEY_DURATION);
                          o.put("fpsMeta", num(f, MediaFormat.KEY_FRAME_RATE));
                          o.put("bitrateMeta", num(f, MediaFormat.KEY_BIT_RATE));
                          o.put("profile", num(f, MediaFormat.KEY_PROFILE));
                          o.put("level", num(f, MediaFormat.KEY_LEVEL));
                          o.put("colorStd", num(f, MediaFormat.KEY_COLOR_STANDARD));
                          o.put("colorTransfer", num(f, MediaFormat.KEY_COLOR_TRANSFER));
                          o.put("colorRange", num(f, MediaFormat.KEY_COLOR_RANGE));
