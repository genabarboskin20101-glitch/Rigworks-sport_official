                  orig.onGeolocationPermissionsShowPrompt(origin, c);
              }

              @Override
              public void onGeolocationPermissionsHidePrompt() {
                  orig.onGeolocationPermissionsHidePrompt();
              }

              @Override
              public void onPermissionRequest(PermissionRequest r) {
                  orig.onPermissionRequest(r);
