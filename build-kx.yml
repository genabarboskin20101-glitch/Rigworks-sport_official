              private static void copyStream(java.io.InputStream in, java.io.OutputStream out) throws java.io.IOException {
                  byte[] buf = new byte[64 * 1024];
                  int n;
                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                  out.flush();
              }

              private Uri publishShared(File src, String name, String mime) throws Exception {
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentResolver cr = act.getContentResolver();
                      Uri col = android.provider.MediaStore.Audio.Media.getContentUri(android.provider.MediaStore.VOLUME_EXTERNAL_PRIMARY);
                      try { // прежние копии, созданные приложением
                          cr.delete(col, android.provider.MediaStore.MediaColumns.RELATIVE_PATH + "=?", new String[] { "Music/LMusic/" });
                      } catch (Throwable ignored) { /* не критично */ }
                      android.content.ContentValues v = new android.content.ContentValues();
                      v.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, name);
                      v.put(android.provider.MediaStore.MediaColumns.MIME_TYPE, mime);
                      v.put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, "Music/LMusic");
                      v.put(android.provider.MediaStore.MediaColumns.IS_PENDING, 1);
                      Uri u = cr.insert(col, v);
                      if (u == null) return null;
                      try {
                          java.io.FileInputStream in = new java.io.FileInputStream(src);
                          java.io.OutputStream out = cr.openOutputStream(u);
                          if (out == null) throw new java.io.IOException("no_output_stream");
                          try { copyStream(in, out); } finally { try { in.close(); } catch (Throwable ignored) { } out.close(); }
                      } catch (Throwable t) {
                          try { cr.delete(u, null, null); } catch (Throwable ignored) { /* уже нет */ }
                          throw new Exception(t);
                      }
                      v.clear();
                      v.put(android.provider.MediaStore.MediaColumns.IS_PENDING, 0);
                      cr.update(u, v, null, null);
                      return u;
                  }
                  // API < 29: файл во внешнем кэше приложения и file:// (для старых систем строгий режим отключаем)
                  File base = act.getExternalCacheDir();
                  if (base == null) return null;
                  File d = new File(base, "share");
                  d.mkdirs();
                  File[] old = d.listFiles();
                  if (old != null) for (File f : old) f.delete();
                  File out = new File(d, name);
                  java.io.FileInputStream in = new java.io.FileInputStream(src);
                  java.io.FileOutputStream os = new java.io.FileOutputStream(out);
                  try { copyStream(in, os); } finally { try { in.close(); } catch (Throwable ignored) { } os.close(); }
                  try {
                      android.os.StrictMode.class.getMethod("disableDeathOnFileUriExposure").invoke(null);
