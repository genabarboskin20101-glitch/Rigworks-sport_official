              private void wake(boolean on) {
                  try {
                      if (on) {
                          if (wl == null) {
                              PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                              if (pm == null) return;
                              wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "kx:media");
                              wl.setReferenceCounted(false);
                          }
                          if (!wl.isHeld()) wl.acquire(4L * 60L * 60L * 1000L);
