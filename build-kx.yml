          cat > build-kx.sh <<'KX_EOF'
          #!/usr/bin/env bash
          # Сборка classes2.dex из src/kx/engine/*.java. Нужны JDK 17+ и Android SDK (platforms + build-tools).
          # На раннере GitHub Actions (ubuntu) SDK уже установлен. Запуск из корня проекта: bash build-kx.sh
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AJ="${ANDROID_JAR:-}"
          if [ -z "$AJ" ]; then
            for p in 36 35 34 33 32 31 30; do
              if [ -f "$SDK/platforms/android-$p/android.jar" ]; then AJ="$SDK/platforms/android-$p/android.jar"; break; fi
            done
          fi
          if [ -z "$AJ" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
            AJ="$SDK/platforms/android-34/android.jar"
          fi
          BT="$(ls -1 "$SDK/build-tools" | sort -V | tail -1)"
          D8="$SDK/build-tools/$BT/d8"
          echo "SDK=$SDK"
          echo "android.jar=$AJ"
          echo "build-tools=$BT"
          java -version 2>&1 | head -1

          rm -rf out dexout kx.jar classes2.dex
          mkdir -p out dexout
          # ВНИМАНИЕ: --release 8 нельзя сочетать с -bootclasspath, поэтому -source/-target
          javac -source 8 -target 8 -Xlint:-options -encoding UTF-8 -bootclasspath "$AJ" -d out $(find src -name '*.java')
          (cd out && jar cf ../kx.jar kx)
          "$D8" --release --min-api 24 --lib "$AJ" --output dexout kx.jar
          mv dexout/classes.dex classes2.dex

          # в dex не должно быть чужих классов: только kx.engine.*
          if [ -x "$SDK/build-tools/$BT/dexdump" ]; then
            "$SDK/build-tools/$BT/dexdump" -f classes2.dex | grep "Class descriptor" | sed "s/.*'\(.*\)'.*/\1/" > classes.txt
            echo "--- классы в dex:"; cat classes.txt
            if grep -v '^Lkx/engine/' classes.txt; then echo "ОШИБКА: в dex попали чужие классы"; exit 1; fi
            grep -q '^Lkx/engine/KxFactory;$' classes.txt || { echo "ОШИБКА: нет KxFactory"; exit 1; }
          fi

          sha256sum classes2.dex | tee classes2.dex.sha256
          base64 -w0 classes2.dex > classes2.dex.b64
          ls -l classes2.dex
          echo "готово: classes2.dex"
          KX_EOF

      - name: Build classes2.dex
        shell: bash
        run: |
          bash build-kx.sh 2>&1 | tee build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kx-dex
          path: |
            classes2.dex
            classes2.dex.sha256
            classes2.dex.b64

      - name: Publish release kx-latest
        shell: bash
        run: |
          SHA="$(cut -d' ' -f1 classes2.dex.sha256)"
          gh release delete kx-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create kx-latest classes2.dex classes2.dex.sha256 \
            --title "KX dex (сборка #${GITHUB_RUN_NUMBER})" \
            --notes "SHA-256: $SHA"
          {
            echo "### classes2.dex готов"
            echo "SHA-256: \`$SHA\`"
            echo "Размер: $(stat -c %s classes2.dex) байт"
            echo "Скачать: Releases → kx-latest → classes2.dex"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show log in summary on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Сборка упала — последние строки лога"
            echo '```'
            tail -n 70 build.log 2>/dev/null || echo "(лога нет — упал шаг до сборки)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
