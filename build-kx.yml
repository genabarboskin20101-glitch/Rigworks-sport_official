              // ---------- доступ ко всей файловой системе устройства (чтение) ----------
              // API 30+: разрешение MANAGE_EXTERNAL_STORAGE (запрашивается через системный экран настроек,
              // пользователь выдаёт его вручную — обычный runtime-диалог для него недоступен).
              // API <30: обычное разрешение READ_EXTERNAL_STORAGE, запрашивается стандартным runtime-диалогом.
              // В любом случае в AndroidManifest.xml должно быть объявлено соответствующее <uses-permission>
              // (это правит сам сборщик, пункт «Разрешения»; это разрешение в нём нужно завести отдельно).

              private boolean hasAllFilesAccessInternal() {
                  try {
                      if (Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager();
                      return act.checkSelfPermission("android.permission.READ_EXTERNAL_STORAGE") == PackageManager.PERMISSION_GRANTED;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Есть ли уже разрешение на чтение всей файловой системы. */
              @JavascriptInterface
              public String hasAllFilesAccess() {
                  return "{\"ok\":true,\"granted\":" + hasAllFilesAccessInternal() + "}";
              }

              /** Запрашивает разрешение: на API 30+ открывает системный экран «Доступ ко всем файлам» для этого
               *  приложения, на более старых — обычный runtime-запрос READ/WRITE_EXTERNAL_STORAGE. Результат
               *  асинхронный — страница должна опросить hasAllFilesAccess() после возврата в приложение
               *  (например, в обработчике возобновления/видимости страницы). */
              @JavascriptInterface
              public String requestAllFilesAccess() {
                  try {
                      act.runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  if (Build.VERSION.SDK_INT >= 30) {
                                      try {
                                          Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                                          i.setData(Uri.parse("package:" + act.getPackageName()));
                                          act.startActivity(i);
                                      } catch (Throwable t) {
                                          act.startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                                      }
                                  } else {
                                      act.requestPermissions(new String[] {
                                          "android.permission.READ_EXTERNAL_STORAGE",
                                          "android.permission.WRITE_EXTERNAL_STORAGE"
                                      }, 7421);
                                  }
                              } catch (Throwable t) {
                                  Log.w(TAG, "requestAllFilesAccess failed", t);
                              }
                          }
                      });
                      return OK;
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              /** Список записей в директории (абсолютный путь, например из Environment.getExternalStorageDirectory()
               *  или произвольного /storage/... при выданном MANAGE_EXTERNAL_STORAGE). Непрочитанные элементы
               *  (нет доступа, спецфайлы) молча пропускаются, а не валят весь список. */
              @JavascriptInterface
              public String listDir(String path) {
                  try {
                      if (!hasAllFilesAccessInternal()) return err("no_permission");
                      if (path == null || path.length() == 0) return err("bad_path");
                      File dirF = new File(path);
                      if (!dirF.isAbsolute()) return err("bad_path");
                      File[] kids = dirF.listFiles();
                      if (kids == null) return err("not_readable");
                      JSONArray arr = new JSONArray();
                      for (File f : kids) {
                          JSONObject e = new JSONObject();
                          e.put("name", f.getName());
                          e.put("path", f.getAbsolutePath());
                          e.put("dir", f.isDirectory());
                          e.put("size", f.isFile() ? f.length() : 0);
                          e.put("mtime", f.lastModified());
                          arr.put(e);
                      }
                      return o("ok", true, "entries", arr).toString();
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              private static final long FS_READ_CHUNK = 2L << 20; // 2 МБ за вызов — безопасно для JS-моста

              /** Читает кусок произвольного файла как base64, начиная с offset. eof=true, когда дочитали до конца. */
              @JavascriptInterface
              public String readFileChunk(String path, long offset) {
                  RandomAccessFile raf = null;
                  try {
                      if (!hasAllFilesAccessInternal()) return err("no_permission");
                      if (path == null || path.length() == 0) return err("bad_path");
                      File f = new File(path);
                      if (!f.isAbsolute() || !f.isFile()) return err("bad_path");
                      raf = new RandomAccessFile(f, "r");
                      long total = raf.length();
                      if (offset < 0 || offset > total) return err("bad_offset");
                      long want = Math.min(FS_READ_CHUNK, total - offset);
                      byte[] buf = new byte[(int) want];
                      raf.seek(offset);
                      raf.readFully(buf);
                      String b64 = Base64.encodeToString(buf, Base64.NO_WRAP);
                      boolean eof = offset + want >= total;
                      return o("ok", true, "data", b64, "size", total, "eof", eof).toString();
                  } catch (Throwable t) {
                      return err(t);
                  } finally {
                      if (raf != null) {
                          try { raf.close(); } catch (Throwable ignored) { /* уже закрыт */ }
                      }
                  }
              }

              @JavascriptInterface
              public synchronized String ingestBegin(String id, String name, long size, long lastModified, String mime) {
                  try {
                      if (!validId(id) || size <= 0) return err("bad_args");
                      File bin = new File(dir, id + ".bin");
                      File ok = new File(dir, id + ".ok");
                      RandomAccessFile prev = open.remove(id);
                      if (prev != null) prev.close();
                      if (ok.exists() && bin.length() == size) {
                          bin.setLastModified(System.currentTimeMillis());
                          return "{\"ok\":true,\"cached\":true}";
                      }
                      ok.delete();
                      bin.delete();
                      long need = size + (64L << 20);
                      if (free() < need) trimCache(need);
                      if (free() < need) return err("no_space");
                      open.put(id, new RandomAccessFile(bin, "rw"));
                      sizes.put(id, size);
                      return "{\"ok\":true,\"cached\":false}";
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              @JavascriptInterface
              public synchronized String ingestChunk(String id, long offset, String b64) {
                  try {
                      RandomAccessFile raf = open.get(id);
                      if (raf == null) return err("not_open");
                      byte[] b = Base64.decode(b64, Base64.DEFAULT);
                      raf.seek(offset);
                      raf.write(b);
                      return OK;
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              @JavascriptInterface
              public synchronized String ingestEnd(String id) {
                  try {
                      RandomAccessFile raf = open.remove(id);
                      if (raf == null) return err("not_open");
                      raf.close();
                      File bin = new File(dir, id + ".bin");
                      Long want = sizes.remove(id);
                      if (want == null || bin.length() != want.longValue()) {
                          bin.delete();
                          return err("size_mismatch");
                      }
                      new File(dir, id + ".ok").createNewFile();
                      // info не считаем: фоновая передача не должна в конце замораживать страницу разбором файла;
                      // экспорт при необходимости вызовет probe(id)
                      return OK;
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              /** Дешёвая проверка: есть ли источник уже в нативном кэше (без разбора файла и без передачи байтов). */
              @JavascriptInterface
              public String has(String id) {
                  try {
                      boolean c = false;
                      if (validId(id)) {
                          File f = fileFor(id);
                          if (f != null) {
                              f.setLastModified(System.currentTimeMillis());
                              c = true;
                          } else {
                              c = uriSrc.get(id) != null;
                          }
                      }
                      return "{\"ok\":true,\"cached\":" + c + "}";
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              @JavascriptInterface
              public String probe(String id) {
                  try {
                      Src s = srcFor(id);
                      if (s == null) return err("unknown_id");
                      return infoJson(s);
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              private String infoJson(Src s) throws Exception {
                  JSONObject r = o("ok", true);
                  try {
                      r.put("info", Probe.info(act, s));
                  } catch (Throwable t) {
                      // не медиафайл (например, картинка) - это не ошибка передачи
                      r.put("info", JSONObject.NULL);
                      r.put("probeError", String.valueOf(t));
                  }
                  return r.toString();
              }

              /** Находит среди выбранных пользователем файлов тот, что соответствует File из страницы (по имени и размеру). */
              @JavascriptInterface
              public synchronized String resolve(String name, long size, long lastModified) {
                  try {
                      Picked hit = null;
                      for (int i = picked.size() - 1; i >= 0; i--) {
                          Picked p = picked.get(i);
                          if (p.size == size && name != null && name.equals(p.name)) {
                              hit = p;
                              break;
                          }
                      }
                      if (hit == null) return o("ok", false, "error", "not_picked", "picked", picked.size(), "hook", hooked).toString();
                      try {
                          AssetFileDescriptor afd = act.getContentResolver().openAssetFileDescriptor(hit.uri, "r");
                          if (afd == null) return err("unreadable");
                          afd.close();
                      } catch (Throwable t) {
                          return o("ok", false, "error", "unreadable", "detail", String.valueOf(t)).toString();
                      }
                      String id = "u" + sha1(hit.uri.toString());
                      uriSrc.put(id, hit.uri);
                      // Разбор контейнера здесь не нужен: редактор info не использует, а вызов синхронный (JS-поток
                      // стоит, пока идёт демукс) — страница замирала на сотни мс при каждом импорте. Экспорт сам
                      // спросит probe(id), если info пустой.
                      JSONObject r = o("ok", true, "id", id, "zeroCopy", true);
                      r.put("info", JSONObject.NULL);
                      return r.toString();
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              @JavascriptInterface
              public synchronized String clearCache() {
                  File[] fs = dir.listFiles();
                  int n = 0;
                  if (fs != null) {
                      for (File f : fs) {
                          if (f.delete()) n++;
                      }
                  }
                  return o("ok", true, "deleted", n).toString();
              }

              @JavascriptInterface
              public String exportStart(String jobJson) {
                  try {
                      if (Build.VERSION.SDK_INT < 29) return unsupported("api<29");
                      if (!jobs.isEmpty()) return err("busy");
                      Exporter e = Exporter.parse(this, "j" + seq.incrementAndGet(), new JSONObject(jobJson));
                      if (!e.unsupported.isEmpty()) return unsupported(e.unsupported.toArray(new String[0]));
                      jobs.put(e.jobId, e);
                      e.start();
                      return o("ok", true, "jobId", e.jobId).toString();
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              private static String unsupported(String... items) {
                  return o("ok", false, "unsupported", new JSONArray(Arrays.asList(items))).toString();
              }

              @JavascriptInterface
              public String exportCancel(String jobId) {
                  Exporter e = jobs.get(jobId);
                  if (e != null) e.cancel();
                  return OK;
              }

              // ---------- «Поделиться» файлом из страницы (например, трек Lmusic) ----------
              // Страница передаёт байты кусками (как ingest*), мост собирает файл во временном кэше,
              // публикует его через MediaStore (API 29+: content:// без каких-либо разрешений и без FileProvider в манифесте)
              // и открывает системный список приложений (ACTION_SEND + chooser). Прежние копии, созданные этим методом,
              // удаляются при следующей отправке (папка Music/LMusic), поэтому место не копится.
              private final HashMap<String, RandomAccessFile> shareOpen = new HashMap<String, RandomAccessFile>();
              private final HashMap<String, String[]> shareMeta = new HashMap<String, String[]>();
              private final HashMap<String, Long> shareSize = new HashMap<String, Long>();

              private static String safeFileName(String name) {
                  String n = name == null ? "" : name.replaceAll("[\\\\/:*?\"<>|\\p{Cntrl}]", "_").trim();
                  if (n.length() > 120) {
                      int dot = n.lastIndexOf('.');
                      String ext = (dot > 0 && n.length() - dot <= 8) ? n.substring(dot) : "";
                      n = n.substring(0, 120 - ext.length()) + ext;
                  }
                  return n.length() == 0 ? "track" : n;
              }

              private static String guessAudioMime(String name, String mime) {
                  if (mime != null && mime.startsWith("audio/") && !mime.contains("*")) return mime;
                  String n = name == null ? "" : name.toLowerCase(java.util.Locale.ROOT);
                  if (n.endsWith(".m4a") || n.endsWith(".mp4")) return "audio/mp4";
                  if (n.endsWith(".aac")) return "audio/aac";
                  if (n.endsWith(".wav")) return "audio/wav";
                  if (n.endsWith(".flac")) return "audio/flac";
                  if (n.endsWith(".ogg") || n.endsWith(".opus") || n.endsWith(".oga")) return "audio/ogg";
                  if (n.endsWith(".amr")) return "audio/amr";
                  return "audio/mpeg";
              }

              private static String extForMime(String mime) {
                  if ("audio/mp4".equals(mime)) return ".m4a";
                  if ("audio/aac".equals(mime)) return ".aac";
                  if ("audio/wav".equals(mime)) return ".wav";
                  if ("audio/flac".equals(mime)) return ".flac";
                  if ("audio/ogg".equals(mime)) return ".ogg";
                  if ("audio/amr".equals(mime)) return ".amr";
                  return ".mp3";
              }

              @JavascriptInterface
              public String canShareFile() {
                  return OK;
              }

              @JavascriptInterface
              public synchronized String shareFileBegin(String id, String name, String mime, long size) {
                  try {
                      if (!validId(id) || size <= 0) return err("bad_args");
                      RandomAccessFile prev = shareOpen.remove(id);
                      if (prev != null) prev.close();
                      File tmp = new File(dir, "share_" + id + ".tmp");
                      tmp.delete();
                      long need = size + (32L << 20);
                      if (free() < need) trimCache(need);
                      if (free() < need) return err("no_space");
                      String fixedMime = guessAudioMime(name, mime);
                      String fixedName = safeFileName(name);
                      if (fixedName.indexOf('.') < 0) fixedName = fixedName + extForMime(fixedMime);
                      shareOpen.put(id, new RandomAccessFile(tmp, "rw"));
                      shareMeta.put(id, new String[] { fixedName, fixedMime });
                      shareSize.put(id, size);
                      return OK;
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              @JavascriptInterface
              public synchronized String shareFileChunk(String id, long offset, String b64) {
                  try {
                      RandomAccessFile raf = shareOpen.get(id);
                      if (raf == null) return err("not_open");
                      byte[] b = Base64.decode(b64, Base64.DEFAULT);
                      raf.seek(offset);
                      raf.write(b);
                      return OK;
                  } catch (Throwable t) {
                      return err(t);
                  }
              }

              @JavascriptInterface
              public synchronized String shareFileEnd(String id, final String title) {
                  File tmp = new File(dir, "share_" + id + ".tmp");
                  try {
                      RandomAccessFile raf = shareOpen.remove(id);
                      if (raf == null) return err("not_open");
                      raf.close();
                      Long want = shareSize.remove(id);
                      String[] m = shareMeta.remove(id);
                      if (want == null || m == null || tmp.length() != want.longValue()) return err("size_mismatch");
                      final String mime = m[1];
                      final Uri u = publishShared(tmp, m[0], mime);
                      if (u == null) return err("publish_failed");
                      act.runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  Intent i = new Intent(Intent.ACTION_SEND);
                                  i.setType(mime);
                                  i.putExtra(Intent.EXTRA_STREAM, u);
                                  if (title != null && title.length() > 0) {
                                      i.putExtra(Intent.EXTRA_SUBJECT, title);
                                      i.putExtra(Intent.EXTRA_TITLE, title);
                                  }
                                  i.setClipData(android.content.ClipData.newRawUri("", u));
                                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  Intent ch = Intent.createChooser(i, title == null || title.length() == 0 ? null : title);
