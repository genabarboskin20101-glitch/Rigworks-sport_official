              boolean isNight(Configuration cfg) {
                  try {
                      Configuration c = cfg != null ? cfg : act.getApplicationContext().getResources().getConfiguration();
                      return (c.uiMode & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Сообщает странице тему: вызывает window.__kxThemeSet('dark'|'light') (его ставит скрипт, который вшивает билдер). */
              void pushTheme(Configuration cfg) {
                  final String js = "window.__kxThemeSet&&window.__kxThemeSet('" + (isNight(cfg) ? "dark" : "light") + "')";
                  act.runOnUiThread(new Runnable() {
                      public void run() {
                          try {
