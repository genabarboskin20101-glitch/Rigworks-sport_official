          package kx.engine;

          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Message;
          import android.view.View;
          import android.webkit.ConsoleMessage;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JsPromptResult;
          import android.webkit.JsResult;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          /**
           * Обёртка над WebChromeClient оболочки. Всё делегирует оригиналу; из onShowFileChooser только
           * запоминает content:// URI выбранных файлов, чтобы нативный экспорт читал их напрямую, без копирования
           * через мост (передача файла через JS шла со скоростью ~9 МБ/с).
           */
          final class FileHook extends WebChromeClient {
              private final WebChromeClient orig;
              private final KxBridge br;

              FileHook(WebChromeClient orig, KxBridge br) {
                  this.orig = orig;
                  this.br = br;
              }

              @Override
              public boolean onShowFileChooser(WebView w, final ValueCallback<Uri[]> cb, FileChooserParams p) {
                  ValueCallback<Uri[]> wrapped = new ValueCallback<Uri[]>() {
                      public void onReceiveValue(Uri[] u) {
                          try {
                              br.recordPicked(u);
                          } catch (Throwable ignored) {
                              // запись URI не должна мешать выбору файла
                          }
                          cb.onReceiveValue(u);
                      }
                  };
                  return orig.onShowFileChooser(w, wrapped, p);
              }

              @Override
              public void onProgressChanged(WebView v, int p) {
                  orig.onProgressChanged(v, p);
