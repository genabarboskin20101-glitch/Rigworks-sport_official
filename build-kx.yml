              /** Новый трек: название, исполнитель, альбом, длительность и обложка (JPEG в base64, может быть пустой). */
              void set(final String t, final String a, final String al, final long d, String artB64) {
                  Bitmap b = null;
                  try {
                      if (artB64 != null && artB64.length() > 0) {
                          byte[] raw = Base64.decode(artB64, Base64.DEFAULT);
                          b = BitmapFactory.decodeByteArray(raw, 0, raw.length);
                      }
                  } catch (Throwable ignored) {
                      // без обложки
                  }
                  final Bitmap fb = b;
                  main.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              title = t == null ? "" : t;
                              artist = a == null ? "" : a;
                              album = al == null ? "" : al;
                              durMs = Math.max(0L, d);
                              posMs = 0L;
                              art = fb;
                              started = true;
                              ensure();
                              publish();
                          } catch (Throwable e) {
                              Log.w(TAG, "media set failed", e);
                          }
                      }
                  });
              }

              /** Играет/пауза и позиция (мс): вызывается при смене состояния и перемотке. */
              void state(final boolean pl, final long pos) {
                  main.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              playing = pl;
                              posMs = Math.max(0L, pos);
                              if (!started) return;
                              ensure();
                              publish();
                          } catch (Throwable e) {
                              Log.w(TAG, "media state failed", e);
                          }
                      }
                  });
              }

              /** Очередь пуста / трек сброшен: убираем уведомление. */
              void clear() {
                  main.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              started = false;
                              playing = false;
                              MediaService.stop(act.getApplicationContext());
                              NotificationManager nm = (NotificationManager) act.getSystemService(Context.NOTIFICATION_SERVICE);
                              if (nm != null) nm.cancel(ID);
                              if (session != null) session.setActive(false);
                          } catch (Throwable e) {
                              Log.w(TAG, "media clear failed", e);
                          }
                      }
                  });
              }

              /** Текущий трек в избранном (сердце в уведомлении закрашено). */
              void fav(final boolean f) {
                  main.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              fav = f;
                              if (!started) return;
                              ensure();
                              publish();
                          } catch (Throwable e) {
                              Log.w(TAG, "media fav failed", e);
                          }
                      }
                  });
              }

              void release() {
                  try {
                      MediaService.stop(act.getApplicationContext());
                  } catch (Throwable ignored) {
                      // сервис не запущен
                  }
                  try {
                      NotificationManager nm = (NotificationManager) act.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.cancel(ID);
                  } catch (Throwable ignored) {
                      // нечего отменять
                  }
                  try {
                      if (receiver != null) act.getApplicationContext().unregisterReceiver(receiver);
                  } catch (Throwable ignored) {
                      // уже снят
                  }
                  receiver = null;
                  try {
                      if (session != null) {
                          session.setActive(false);
                          session.release();
                      }
                  } catch (Throwable ignored) {
                      // уже освобождена
                  }
                  session = null;
              }

              @SuppressWarnings("deprecation")
              private void ensure() {
                  if (session != null) return;
                  Context c = act.getApplicationContext();
                  session = new MediaSession(c, "LMusic");
                  session.setFlags(MediaSession.FLAG_HANDLES_MEDIA_BUTTONS | MediaSession.FLAG_HANDLES_TRANSPORT_CONTROLS);
                  session.setCallback(new MediaSession.Callback() {
                      @Override
                      public void onPlay() { sink.action("play", 0L); }

                      @Override
                      public void onPause() { sink.action("pause", 0L); }

                      @Override
                      public void onStop() { sink.action("pause", 0L); }

                      @Override
                      public void onSkipToNext() { sink.action("next", 0L); }

                      @Override
                      public void onSkipToPrevious() { sink.action("prev", 0L); }

                      @Override
                      public void onSeekTo(long pos) { sink.action("seek", pos); }

                      @Override
