              // ---------- виброотклик (p0.24-haptic) ----------
              // navigator.vibrate в WebView ненадёжен (нужны разрешение и свежая активация, короткие импульсы режутся), поэтому
              // страница зовёт KExport.haptic("tick" | "tap" | "detent" | "detentMajor" | "release" | "confirm" | "heart" | "on" | "off" | "trackChange").
              // Порядок: 1) Vibrator (составные примитивы на API 30+, иначе волновая форма с амплитудами) — нужно <uses-permission VIBRATE>;
              // 2) без разрешения — View.performHapticFeedback (разрешение не требуется). Возвращает true, если эффект запущен.
              private Vibrator vib;
              private boolean vibInit;
              private volatile boolean vibPerm = true;
              private int primMask = -1; // биты: 1 CLICK, 2 TICK, 4 QUICK_RISE, 8 QUICK_FALL, 16 SLOW_RISE

              private synchronized Vibrator vibrator() {
                  if (!vibInit) {
                      vibInit = true;
                      try {
                          if (Build.VERSION.SDK_INT >= 31) {
                              Object vm = act.getSystemService("vibrator_manager");
                              if (vm instanceof android.os.VibratorManager) vib = ((android.os.VibratorManager) vm).getDefaultVibrator();
                          }
                          if (vib == null) vib = (Vibrator) act.getSystemService(Context.VIBRATOR_SERVICE);
                          if (vib != null && !vib.hasVibrator()) vib = null;
                          vibPerm = act.checkSelfPermission("android.permission.VIBRATE") == PackageManager.PERMISSION_GRANTED;
                      } catch (Throwable t) {
                          Log.w(TAG, "vibrator init failed", t);
                      }
                  }
                  return vib;
              }

              /** Длительности сегментов (чётные индексы — импульс, нечётные — пауза) в мс; минимум импульса 8-10 мс, иначе моторчик не отрабатывает. */
              private static long[] hapticTimings(String n) {
                  if ("tick".equals(n)) return new long[]{10};
                  if ("tap".equals(n)) return new long[]{14};
                  if ("detent".equals(n)) return new long[]{8};
                  if ("detentMajor".equals(n)) return new long[]{16};
                  if ("release".equals(n)) return new long[]{12, 26, 8};
                  if ("confirm".equals(n)) return new long[]{12, 30, 10};
                  if ("heart".equals(n)) return new long[]{16, 70, 12, 140, 8};
                  if ("on".equals(n)) return new long[]{8, 10, 9, 9, 10, 8, 12, 7, 14};
                  if ("off".equals(n)) return new long[]{14, 7, 12, 8, 10, 9, 9, 10, 8};
                  if ("trackChange".equals(n)) return new long[]{8, 14, 9, 12, 10, 10, 12, 8, 15};
                  return null;
              }

              private static int hapticAmp(String n, int onIndex, int onCount) {
                  if ("detent".equals(n)) return 70;
                  if ("tick".equals(n)) return 95;
                  if ("tap".equals(n)) return 140;
                  if ("detentMajor".equals(n)) return 150;
                  if ("release".equals(n)) return 120;
                  if ("confirm".equals(n)) return onIndex == 0 ? 150 : 90;
                  if ("heart".equals(n)) return onIndex == 0 ? 220 : (onIndex == 1 ? 170 : 110);
                  float k = onCount <= 1 ? 1f : (float) onIndex / (float) (onCount - 1); // нарастание (on/trackChange) или затухание (off)
                  if ("off".equals(n)) k = 1f - k;
                  return 55 + Math.round(k * 200f);
              }

              @SuppressWarnings("deprecation")
              private boolean playWaveform(Vibrator v, String n) {
                  long[] t = hapticTimings(n);
                  if (t == null) return false;
                  if (Build.VERSION.SDK_INT >= 26 && v.hasAmplitudeControl()) {
                      int[] a = new int[t.length];
                      int onCount = (t.length + 1) / 2;
                      for (int i = 0; i < t.length; i++) a[i] = (i % 2 == 0) ? hapticAmp(n, i / 2, onCount) : 0;
                      v.vibrate(VibrationEffect.createWaveform(t, a, -1));
                  } else if (Build.VERSION.SDK_INT >= 26) {
                      long[] w = new long[t.length];
                      System.arraycopy(t, 0, w, 0, t.length);
                      v.vibrate(VibrationEffect.createWaveform(w, -1));
                  } else {
                      long[] legacy = new long[t.length + 1]; // у старого API первый элемент — пауза до начала
                      System.arraycopy(t, 0, legacy, 1, t.length);
                      v.vibrate(legacy, -1);
                  }
                  return true;
              }

              private int primitives(Vibrator v) {
                  if (primMask >= 0) return primMask;
                  int m = 0;
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          if (v.areAllPrimitivesSupported(VibrationEffect.Composition.PRIMITIVE_CLICK)) m |= 1;
                          if (v.areAllPrimitivesSupported(VibrationEffect.Composition.PRIMITIVE_TICK)) m |= 2;
                          if (v.areAllPrimitivesSupported(VibrationEffect.Composition.PRIMITIVE_QUICK_RISE)) m |= 4;
                          if (v.areAllPrimitivesSupported(VibrationEffect.Composition.PRIMITIVE_QUICK_FALL)) m |= 8;
                          if (v.areAllPrimitivesSupported(VibrationEffect.Composition.PRIMITIVE_SLOW_RISE)) m |= 16;
                      }
                  } catch (Throwable ignored) {
                      m = 0;
                  }
                  primMask = m;
                  return m;
              }

              /** API 30+: аппаратные примитивы дают заметно более «чистый» отклик, чем сырые импульсы; false — примитивов нет, нужна волновая форма. */
              private boolean playComposition(Vibrator v, String n) {
                  if (Build.VERSION.SDK_INT < 30) return false;
                  int m = primitives(v);
                  VibrationEffect.Composition c = VibrationEffect.startComposition();
                  final int CLICK = VibrationEffect.Composition.PRIMITIVE_CLICK, TICK = VibrationEffect.Composition.PRIMITIVE_TICK;
                  if ("tick".equals(n) && (m & 2) != 0) c.addPrimitive(TICK, 0.75f);
                  else if ("detent".equals(n) && (m & 2) != 0) c.addPrimitive(TICK, 0.5f);
                  else if ("detentMajor".equals(n) && (m & 1) != 0) c.addPrimitive(CLICK, 0.45f);
                  else if ("tap".equals(n) && (m & 1) != 0) c.addPrimitive(CLICK, 0.6f);
                  else if ("release".equals(n) && (m & 1) != 0) c.addPrimitive(CLICK, 0.4f);
                  else if ("confirm".equals(n) && (m & 3) == 3) {
                      c.addPrimitive(CLICK, 0.6f);
                      c.addPrimitive(TICK, 0.4f, 40);
                  } else if ("heart".equals(n) && (m & 1) != 0) {
                      c.addPrimitive(CLICK, 0.9f);
                      c.addPrimitive(CLICK, 0.6f, 90);
                  } else if ("on".equals(n) && (m & 4) != 0) c.addPrimitive(VibrationEffect.Composition.PRIMITIVE_QUICK_RISE, 0.8f);
                  else if ("off".equals(n) && (m & 8) != 0) c.addPrimitive(VibrationEffect.Composition.PRIMITIVE_QUICK_FALL, 0.8f);
                  else if ("trackChange".equals(n) && (m & 16) != 0) c.addPrimitive(VibrationEffect.Composition.PRIMITIVE_SLOW_RISE, 0.7f);
                  else return false;
                  v.vibrate(c.compose());
                  return true;
              }

              private static int feedbackConst(String n) {
                  int api = Build.VERSION.SDK_INT;
                  if ("tick".equals(n) || "detent".equals(n)) return api >= 34 && "detent".equals(n) ? 25 : 4; // SEGMENT_FREQUENT_TICK / CLOCK_TICK
                  if ("detentMajor".equals(n)) return api >= 34 ? 24 : 4; // SEGMENT_TICK
                  if ("tap".equals(n)) return 1; // VIRTUAL_KEY
                  if ("release".equals(n)) return api >= 27 ? 7 : 1; // KEYBOARD_RELEASE
                  if ("confirm".equals(n) || "heart".equals(n)) return api >= 30 ? 16 : 1; // CONFIRM
                  if ("on".equals(n)) return api >= 34 ? 21 : (api >= 23 ? 6 : 1); // TOGGLE_ON / CONTEXT_CLICK
                  if ("off".equals(n)) return api >= 34 ? 22 : (api >= 23 ? 6 : 1); // TOGGLE_OFF / CONTEXT_CLICK
                  if ("trackChange".equals(n)) return api >= 30 ? 13 : 1; // GESTURE_END
                  return -1;
              }

              private boolean performFeedback(String n) {
                  final int c = feedbackConst(n);
                  if (c < 0) return false;
                  act.runOnUiThread(new Runnable() {
                      public void run() {
                          try {
                              // 2 = FLAG_IGNORE_GLOBAL_SETTING (на Android 13+ игнорируется системой): у приложения есть свой выключатель вибро
                              web.performHapticFeedback(c, 2);
                          } catch (Throwable ignored) {
                              // WebView уже уничтожен
                          }
                      }
                  });
                  return true;
              }

              /** Запускает эффект по имени. true — эффект запущен (нативно), false — страница может попробовать navigator.vibrate. */
              @JavascriptInterface
              public boolean haptic(String name) {
                  try {
                      if (name == null) return false;
                      Vibrator v = vibrator();
                      if (v != null && vibPerm) {
                          try {
                              if (playComposition(v, name) || playWaveform(v, name)) {
                                  hapticPath = "vibrator";
                                  return true;
                              }
                          } catch (SecurityException se) {
                              vibPerm = false; // разрешения VIBRATE в манифесте нет — дальше сразу performHapticFeedback
                          } catch (Throwable t) {
                              Log.w(TAG, "vibrate failed: " + t);
                          }
                      }
                      hapticPath = "feedback(без VIBRATE)";
                      return performFeedback(name);
                  } catch (Throwable t) {
                      return false;
                  }
              }

              private volatile String hapticPath = "none";

              /** Диагностика для страницы (Настройки → Вибрация → «Проверить вибрацию»). */
              @JavascriptInterface
              public String hapticInfo() {
                  try {
                      Vibrator v = vibrator();
                      JSONObject o = new JSONObject();
                      o.put("api", Build.VERSION.SDK_INT);
                      o.put("hasVibrator", v != null);
                      o.put("perm", act.checkSelfPermission("android.permission.VIBRATE") == PackageManager.PERMISSION_GRANTED);
                      o.put("amp", v != null && Build.VERSION.SDK_INT >= 26 && v.hasAmplitudeControl());
                      o.put("path", hapticPath);
                      return o.toString();
                  } catch (Throwable t) {
                      return "{}";
                  }
              }

