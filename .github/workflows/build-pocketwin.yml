name: Build PocketWin APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Имя приложения под значком Android"
        required: true
        default: "PocketWin"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK on GitHub-hosted runner
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout this repository (workflow only)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the removed Android SDK tools package.
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Download EXE and integration from latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          INPUT_DIR="$RUNNER_TEMP/pocketwin-input"
          mkdir -p "$INPUT_DIR"
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern "autorun.exe" \
            --pattern "PocketWin_Winlator_Integration.zip" \
            --dir "$INPUT_DIR"
          test -s "$INPUT_DIR/autorun.exe" || { echo "Release asset autorun.exe is missing."; exit 1; }
          test -s "$INPUT_DIR/PocketWin_Winlator_Integration.zip" || { echo "Release asset PocketWin_Winlator_Integration.zip is missing."; exit 1; }
          mkdir -p "$RUNNER_TEMP/pocketwin-integration"
          unzip -q "$INPUT_DIR/PocketWin_Winlator_Integration.zip" -d "$RUNNER_TEMP/pocketwin-integration"
          PATCHER="$(find "$RUNNER_TEMP/pocketwin-integration" -type f -path '*/native-integration/apply-pocketwin-patch.py' -print -quit)"
          test -n "$PATCHER" || { echo "Could not find native-integration/apply-pocketwin-patch.py in integration ZIP."; exit 1; }
          echo "POCKETWIN_PATCHER=$PATCHER" >> "$GITHUB_ENV"
          echo "POCKETWIN_EXE=$INPUT_DIR/autorun.exe" >> "$GITHUB_ENV"

      - name: Fetch Winlator Android source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/brunodev85/winlator-app.git "$RUNNER_TEMP/winlator-app"

      - name: Apply PocketWin auto-start integration
        env:
          APP_NAME: ${{ inputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$POCKETWIN_PATCHER" --source "$RUNNER_TEMP/winlator-app" --app-name "$APP_NAME"

      # Backward compatibility: old integration ZIPs created backup files inside res/.
      # Android Gradle Plugin rejects e.g. strings.xml.pocketwin-backup as an Android resource.
      - name: Remove legacy patch backups from Android resources
        shell: bash
        run: |
          set -euo pipefail
          RES_DIR="$RUNNER_TEMP/winlator-app/app/src/main/res"
          if [[ -d "$RES_DIR" ]]; then
            find "$RES_DIR" -type f \
              \( -name '*.pocketwin-backup' -o -name '*.pocketwin-tmp' \) \
              -print -delete
          fi

      - name: Configure Gradle for large bundled EXE
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$RUNNER_TEMP/winlator-app"
          python3 - "$PROJECT_DIR/app/build.gradle" "$PROJECT_DIR/gradle.properties" <<'PYCODE'
          from pathlib import Path
          import re
          import sys

          gradle_file = Path(sys.argv[1])
          properties_file = Path(sys.argv[2])
          text = gradle_file.read_text(encoding="utf-8")
          uncompressed_exe = re.compile(r"noCompress\s*\+=\s*\[[^\]]*['\"]exe['\"][^\]]*\]")
          if not uncompressed_exe.search(text):
              android_resources = re.search(r"(?s)androidResources\s*\{([^{}]*)\}", text)
              if android_resources:
                  block = android_resources.group(0)
                  block_body = android_resources.group(1)
                  if "noCompress" in block_body:
                      block = block[:-1] + "\n        noCompress += ['exe']\n    }"
                  else:
                      block = block[:-1] + "\n        noCompress += ['exe']\n    }"
                  text = text[:android_resources.start()] + block + text[android_resources.end():]
              else:
                  text, count = re.subn(r"(?m)^(\s*android\s*\{\s*)", lambda m: m.group(1) + "\n    androidResources {\n        noCompress += ['exe']\n    }\n", text, count=1)
                  if count != 1:
                      raise SystemExit("Could not safely configure Android noCompress for EXE assets.")
              gradle_file.write_text(text, encoding="utf-8")
              print("Configured Android packaging to keep .exe assets uncompressed.")
          else:
              print("Android packaging already marks .exe assets as uncompressed.")

          properties = properties_file.read_text(encoding="utf-8").splitlines() if properties_file.exists() else []
          settings = {
              "org.gradle.jvmargs": "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8",
              "org.gradle.workers.max": "2",
              "org.gradle.parallel": "false",
          }
          keys = set(settings)
          properties = [line for line in properties if not any(line.strip().startswith(key + "=") for key in keys)]
          properties.extend(f"{key}={value}" for key, value in settings.items())
          properties_file.write_text("\n".join(properties).rstrip() + "\n", encoding="utf-8")
          print("Gradle memory configured: -Xmx4g, maximum 2 workers, parallel build disabled.")
          PYCODE

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/winlator-app"
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace :app:assembleDebug "-PpocketwinExe=$POCKETWIN_EXE"
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketWin-debug-APK
          path: ${{ runner.temp }}/winlator-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
