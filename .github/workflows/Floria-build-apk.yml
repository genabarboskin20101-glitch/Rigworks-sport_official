name: Build Floria APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Supports both ways of uploading the project:
      # 1) extracted files in the repository, or
      # 2) Floria-Android-Project.zip uploaded as a file to the repository root.
      - name: Find or extract Floria source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "settings.gradle" || -f "settings.gradle.kts" ]]; then
            project_dir="."
          else
            if [[ -f "floria-browser/settings.gradle" || -f "floria-browser/settings.gradle.kts" ]]; then
              project_dir="floria-browser"
            else
              archive="$(find . -maxdepth 3 -type f -iname '*floria*.zip' -not -path './.git/*' -print -quit || true)"
              if [[ -n "$archive" ]]; then
                mkdir -p .floria-source
                unzip -oq "$archive" -d .floria-source
              fi

              settings_file="$(find .floria-source floria-browser -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit 2>/dev/null || true)"
              if [[ -z "$settings_file" ]]; then
                echo "::error::Floria Gradle project not found. Upload Floria-Android-Project.zip to the repository root, or upload the contents of the floria-browser folder. The workflow YAML alone is not the app source."
                echo "Repository files (first 80):"
                find . -maxdepth 3 -type f -not -path './.git/*' -print | head -80
                exit 1
              fi
              project_dir="$(dirname "$settings_file")"
            fi
          fi

          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Floria project directory: $project_dir"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Floria-debug-apk
          path: ${{ steps.source.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
