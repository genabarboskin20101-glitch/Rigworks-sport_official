name: Build LMusic APK

# Собирает приложение LMusic целиком (WebView-оболочка + app/src/main/assets/www/index.html + нативный мост kx.engine)
# и подписывает его ключом из signing/lmusic.keystore.
# Запускается сам при каждом коммите (push) и вручную: вкладка Actions → Build LMusic APK → Run workflow.
# Результат: Releases → lmusic-latest → LMusic.apk (стабильная ссылка), а также артефакт LMusic-apk внизу страницы запуска.

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project
        shell: bash
        run: |
          # проект ищем сами: он может лежать в корне репозитория или во вложенной папке (если архив распаковали «в папку»)
          S="$(find . -maxdepth 4 -name settings.gradle -not -path './.git/*' | head -1)"
          [ -n "$S" ] || { echo "::error::settings.gradle не найден — файлы проекта из архива не загружены в репозиторий"; ls -R . | head -50; exit 1; }
          PROJ="$(dirname "$S")"
          for f in app/build.gradle build.gradle signing/lmusic.keystore app/src/main/AndroidManifest.xml \
                   app/src/main/assets/www/index.html app/src/main/java/com/lmusic/app/WebViewActivity.java app/src/main/java/kx/engine/KxBridge.java; do
            [ -f "$PROJ/$f" ] || { echo "::error::Нет файла $PROJ/$f"; exit 1; }
          done
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Проект найден: $PROJ"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJ"
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify signature
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -1 "$SDK/build-tools" | sort -V | tail -1)"
          APK="$(ls "$PROJ"/app/build/outputs/apk/release/*.apk | head -1)"
          cp "$APK" LMusic.apk
          "$SDK/build-tools/$BT/apksigner" verify --print-certs LMusic.apk | tee sign.log
          sha256sum LMusic.apk | tee LMusic.apk.sha256
          ls -l LMusic.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LMusic-apk
          path: |
            LMusic.apk
            LMusic.apk.sha256

      - name: Publish release lmusic-latest
        shell: bash
        run: |
          SHA="$(cut -d' ' -f1 LMusic.apk.sha256)"
          gh release delete lmusic-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create lmusic-latest LMusic.apk LMusic.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "LMusic (сборка #${GITHUB_RUN_NUMBER})" \
            --notes "SHA-256: $SHA"
          {
            echo "### LMusic.apk готов"
            echo "Версия: 1.0.${GITHUB_RUN_NUMBER}"
            echo "SHA-256: \`$SHA\`"
            echo "Размер: $(stat -c %s LMusic.apk) байт"
            echo "Скачать: Releases → lmusic-latest → LMusic.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show log in summary on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Сборка упала — последние строки лога"
            echo '```'
            tail -n 80 build.log 2>/dev/null || echo "(лога нет — упал шаг до сборки)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          
