name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show repository files
        shell: bash
        run: |
          echo "Repository root: $GITHUB_WORKSPACE"
          echo "Top-level entries:"
          ls -la
          echo "ZIP archives in repository root:"
          find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort || true

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"

          if [[ -f "$workspace/android/settings.gradle.kts" || -f "$workspace/android/settings.gradle" ]]; then
            android_dir="$workspace/android"
            echo "Android source project already exists at repository root."
          else
            archive=""
            for candidate in \
              "$workspace/lira_audio_fixed.zip" \
              "$workspace/lira_audio_fixed_autounzip.zip" \
              "$workspace/lira_audio.zip"; do
              if [[ -f "$candidate" ]]; then
                archive="$candidate"
                break
              fi
            done

            if [[ -z "$archive" ]]; then
              while IFS= read -r candidate; do
                name="$(basename "$candidate" | tr '[:upper:]' '[:lower:]')"
                case "$name" in
                  *apk*|*debug*) continue ;;
                esac
                archive="$candidate"
                break
              done < <(find "$workspace" -maxdepth 1 -type f -iname '*.zip' -print | sort)
            fi

            if [[ -z "$archive" ]]; then
              echo "ERROR: Android sources were not found, and no source ZIP archive exists in the repository root." >&2
              echo "Upload the project ZIP (for example, lira_audio_fixed.zip) or upload its full contents." >&2
              exit 1
            fi

            extract_root="$RUNNER_TEMP/lira-audio-source"
            rm -rf "$extract_root"
            mkdir -p "$extract_root"
            echo "Extracting source archive: $(basename "$archive")"
            unzip -q "$archive" -d "$extract_root"

            settings_file="$(find "$extract_root" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)"
            if [[ -z "$settings_file" ]]; then
              echo "ERROR: ZIP archive was extracted, but no Gradle settings file was found inside it." >&2
              echo "Make sure the archive contains android/settings.gradle.kts and android/app/build.gradle.kts." >&2
              exit 1
            fi
            android_dir="$(dirname "$settings_file")"
            echo "Android project extracted to: $android_dir"
          fi

          if [[ ! -f "$android_dir/app/build.gradle.kts" && ! -f "$android_dir/app/build.gradle" ]]; then
            echo "ERROR: Found Gradle settings at '$android_dir', but app/build.gradle(.kts) is missing." >&2
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$android_dir" >> "$GITHUB_ENV"
          echo "Detected Android project at: $android_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: gradle --project-dir "$ANDROID_PROJECT_DIR" --no-daemon --stacktrace assembleDebug

      - name: Collect debug APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$source_apk" ]]; then
            echo "ERROR: Gradle finished, but APK was not found at: $source_apk" >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$source_apk" "$GITHUB_WORKSPACE/artifacts/lira-audio-onnx-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/artifacts/lira-audio-onnx-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lira-audio-onnx-debug-apk
          path: artifacts/lira-audio-onnx-debug.apk
          if-no-files-found: error
          retention-days: 14
