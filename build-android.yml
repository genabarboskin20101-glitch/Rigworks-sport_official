name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show repository files
        shell: bash
        run: |
          echo "Repository root: $GITHUB_WORKSPACE"
          echo "Ref: $GITHUB_REF | SHA: $GITHUB_SHA | Event: $GITHUB_EVENT_NAME"
          echo "Tracked files (first 80):"
          git ls-files | head -80
          echo "Tracked file count: $(git ls-files | wc -l)"
          echo "Submodules / gitlinks:"
          git ls-files -s | grep '^160000' || echo "none"
          echo "Top-level entries:"
          ls -la
          echo "Gradle settings files in repository:"
          find . -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -not -path './.git/*' -not -path '*/.gradle/*' -not -path '*/build/*' -print

      - name: Unpack project archive if uploaded as .zip
        shell: bash
        run: |
          if [[ ! -f "android/settings.gradle.kts" && ! -f "android/settings.gradle" ]]; then
            for z in ./*.zip; do
              [[ -f "$z" ]] || continue
              echo "Unpacking $z"
              unzip -q -o "$z" -d "$RUNNER_TEMP/unz"
              # support archives with or without a top-level wrapper folder
              if [[ -d "$RUNNER_TEMP/unz/android" ]]; then
                cp -a "$RUNNER_TEMP/unz/." .
              else
                inner="$(find "$RUNNER_TEMP/unz" -maxdepth 2 -type d -name android -print -quit)"
                [[ -n "$inner" ]] && cp -a "$(dirname "$inner")/." .
              fi
              break
            done
          fi
          ls -la

      - name: Locate Android project
        shell: bash
        run: |
          if [[ -f "android/settings.gradle.kts" || -f "android/settings.gradle" ]]; then
            android_dir="android"
          else
            settings_file="$(find . -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -not -path './.git/*' -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)"
            if [[ -z "$settings_file" ]]; then
              echo "ERROR: No Android Gradle source project exists in this repository checkout." >&2
              echo "This workflow file alone is not enough to build the APK." >&2
              echo "Upload the FULL contents of the provided project archive to the repository root." >&2
              echo "Expected structure: .github/workflows/build-android.yml and android/settings.gradle.kts" >&2
              exit 1
            fi
            android_dir="$(dirname "$settings_file")"
          fi

          if [[ ! -f "$android_dir/app/build.gradle.kts" && ! -f "$android_dir/app/build.gradle" ]]; then
            echo "ERROR: Android Gradle settings were found in '$android_dir', but app/build.gradle(.kts) is missing." >&2
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$android_dir" >> "$GITHUB_ENV"
          echo "Detected Android project at: $android_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: gradle --project-dir "$ANDROID_PROJECT_DIR" --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lira-audio-onnx-debug-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
