name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # The project may be at the repository root (android/) or nested
      # inside lira_offline_kit/android/. Search as a fallback so the
      # workflow does not fail due to a hard-coded working-directory.
      - name: Locate Android project
        shell: bash
        run: |
          if [[ -f "android/settings.gradle.kts" || -f "android/settings.gradle" ]]; then
            android_dir="android"
          elif [[ -f "lira_offline_kit/android/settings.gradle.kts" || -f "lira_offline_kit/android/settings.gradle" ]]; then
            android_dir="lira_offline_kit/android"
          else
            settings_file="$(find . -maxdepth 5 -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)"
            if [[ -z "$settings_file" ]]; then
              echo "ERROR: Android Gradle project was not found." >&2
              echo "Expected android/settings.gradle(.kts) or lira_offline_kit/android/settings.gradle(.kts)." >&2
              echo "Upload the contents of the lira_offline_kit folder to the repository, or keep that folder inside the repository." >&2
              echo "Gradle settings files found (if any):" >&2
              find . -maxdepth 5 -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print >&2 || true
              exit 1
            fi
            android_dir="$(dirname "$settings_file")"
          fi

          if [[ ! -f "$android_dir/app/build.gradle.kts" && ! -f "$android_dir/app/build.gradle" ]]; then
            echo "ERROR: Found Gradle settings in '$android_dir', but its app/build.gradle(.kts) file is missing." >&2
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$android_dir" >> "$GITHUB_ENV"
          echo "Detected Android project at: $android_dir"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        shell: bash
        run: gradle --project-dir "$ANDROID_PROJECT_DIR" --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lira-audio-onnx-debug-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
