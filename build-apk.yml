name: Build LMusic APK

# Собирает LMusic (WebView + assets + нативный мост) и публикует подписанный APK.
# Корень проекта автоматически определяется: корень репозитория, вложенная папка или ZIP в репозитории.

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate project and check required files
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          is_project_root() {
            local dir="$1"
            [[ -f "$dir/app/build.gradle" && -f "$dir/settings.gradle" && -f "$dir/build.gradle" ]]
          }

          # Case 1: project files are already at the repository root.
          if is_project_root "$ROOT"; then
            PROJECT_DIR="$ROOT"
          else
            # Case 2: the project was committed inside a subdirectory.
            CANDIDATE="$(find "$ROOT" -mindepth 2 -type f -path '*/app/build.gradle' \
              -not -path '*/.git/*' -not -path '*/.github/*' -print -quit 2>/dev/null || true)"
            if [[ -n "$CANDIDATE" ]]; then
              CANDIDATE_DIR="$(dirname "$(dirname "$CANDIDATE")")"
              if is_project_root "$CANDIDATE_DIR"; then
                PROJECT_DIR="$CANDIDATE_DIR"
              fi
            fi

            # Case 3: only the project ZIP was committed/uploaded to the repository.
            if [[ -z "$PROJECT_DIR" ]]; then
              EXTRACT_DIR="$RUNNER_TEMP/lmusic-project"
              while IFS= read -r -d '' ARCHIVE; do
                if unzip -Z1 "$ARCHIVE" 2>/dev/null | grep -Eq '(^|/)app/build.gradle$'; then
                  rm -rf "$EXTRACT_DIR"
                  mkdir -p "$EXTRACT_DIR"
                  unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"
                  CANDIDATE="$(find "$EXTRACT_DIR" -type f -path '*/app/build.gradle' -print -quit 2>/dev/null || true)"
                  if [[ -n "$CANDIDATE" ]]; then
                    CANDIDATE_DIR="$(dirname "$(dirname "$CANDIDATE")")"
                    if is_project_root "$CANDIDATE_DIR"; then
                      PROJECT_DIR="$CANDIDATE_DIR"
                      break
                    fi
                  fi
                fi
              done < <(find "$ROOT" -maxdepth 4 -type f -iname '*.zip' -not -path '*/.git/*' -print0)
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo '::error::Не найден корень Android-проекта. Распакуйте LMusic-project.zip в корень репозитория или добавьте архив в репозиторий.'
            echo 'Файлы в корне репозитория:'
            ls -la "$ROOT"
            exit 1
          fi

          for f in \
            app/build.gradle settings.gradle build.gradle signing/lmusic.keystore \
            app/src/main/AndroidManifest.xml app/src/main/assets/www/index.html \
            app/src/main/java/com/lmusic/app/WebViewActivity.java \
            app/src/main/java/kx/engine/KxBridge.java; do
            if [[ ! -f "$PROJECT_DIR/$f" ]]; then
              echo "::error::В найденном корне проекта ($PROJECT_DIR) отсутствует файл: $f"
              exit 1
            fi
          done

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Корень проекта: $PROJECT_DIR"
          echo 'Структура проекта в порядке'

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build.log

      - name: Verify signature and prepare APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          [[ -n "$BT" ]] || { echo '::error::Не найдены Android SDK build-tools'; exit 1; }
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$APK" ]] || { echo '::error::Gradle не создал APK в app/build/outputs/apk/release'; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/LMusic.apk"
          "$SDK/build-tools/$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/LMusic.apk" | tee sign.log
          (cd "$GITHUB_WORKSPACE" && sha256sum LMusic.apk > LMusic.apk.sha256)
          ls -l "$GITHUB_WORKSPACE/LMusic.apk" "$GITHUB_WORKSPACE/LMusic.apk.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LMusic-apk
          path: |
            LMusic.apk
            LMusic.apk.sha256

      - name: Publish release lmusic-latest
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(cut -d' ' -f1 LMusic.apk.sha256)"
          gh release delete lmusic-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create lmusic-latest LMusic.apk LMusic.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "LMusic (сборка #${GITHUB_RUN_NUMBER})" \
            --notes "SHA-256: $SHA"
          {
            echo '### LMusic.apk готов'
            echo "Версия: 1.0.${GITHUB_RUN_NUMBER}"
            echo "SHA-256: \`$SHA\`"
            echo "Размер: $(stat -c %s LMusic.apk) байт"
            echo 'Скачать: Releases → lmusic-latest → LMusic.apk'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show log in summary on failure
        if: failure()
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          {
            echo '### Сборка упала — последние строки лога'
            echo '```'
            if [[ -n "${PROJECT_DIR:-}" && -f "$PROJECT_DIR/build.log" ]]; then
              tail -n 80 "$PROJECT_DIR/build.log"
            elif [[ -f build.log ]]; then
              tail -n 80 build.log
            else
              echo '(лога нет — упал шаг до сборки)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
